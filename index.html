<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#238CCD">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jornada">
<title>Jornada</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="robots" content="noindex, nofollow">
<style>
/* Letras guardadas con la app: no dependen de internet ni de Google. */
@font-face{font-family:"Barlow";font-style:normal;font-weight:400;font-display:swap;src:url(font-barlow-400.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-style:normal;font-weight:500;font-display:swap;src:url(font-barlow-500.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-style:normal;font-weight:600;font-display:swap;src:url(font-barlow-600.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:600;font-display:swap;src:url(font-barlow-condensed-600.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:700;font-display:swap;src:url(font-barlow-condensed-700.woff2) format("woff2")}
/* Layout: una columna del ancho de un teléfono, centrada, con barra de acción fija abajo en la pantalla principal. */
:root{
  --bg:#EEF3F8;--surface:#FFFFFF;--field:#F5F8FB;--ink:#10202D;--muted:#4E6275;--line:#D0DBE5;
  --accent:#1969A0;--on-accent:#FFFFFF;--brand:#238CCD;--brand-y:#FDD20E;--ph:#5F7183;--warn-bg:#FBEBCB;--warn:#744600;--ok-bg:#DCEFE2;--ok:#14502F;--err:#A12A2A;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--body:"Barlow",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C151D;--surface:#15222D;--field:#101B25;--ink:#E7EFF6;--muted:#9DB2C4;--line:#2A3B4A;
  --accent:#52B0EA;--on-accent:#04192A;--brand:#238CCD;--brand-y:#FDD20E;--ph:#7F94A6;--warn-bg:#3A2E10;--warn:#F0C25E;--ok-bg:#1B3A28;--ok:#8FD6AC;--err:#F29A9A;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C151D;--surface:#15222D;--field:#101B25;--ink:#E7EFF6;--muted:#9DB2C4;--line:#2A3B4A;
  --accent:#52B0EA;--on-accent:#04192A;--brand:#238CCD;--brand-y:#FDD20E;--ph:#7F94A6;--warn-bg:#3A2E10;--warn:#F0C25E;--ok-bg:#1B3A28;--ok:#8FD6AC;--err:#F29A9A;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;padding-inline:16px;padding-block:14px 110px}
.app{max-width:440px;margin-inline:auto;display:flex;flex-direction:column;gap:14px}
h1,h2{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;line-height:1.1;text-wrap:balance}
h1{font-size:30px}h2{font-size:22px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sub{color:var(--muted);font-size:14px;margin:2px 0 0}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;border-radius:999px;padding:4px 10px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lbl{font-size:16px;font-weight:700;color:var(--ink);margin:0 0 5px;display:block}
input[type=text],input[type=time],input[type=number]{width:100%;min-height:48px;font:inherit;font-size:17px;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
input:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.err{color:var(--err);font-size:13px;margin:4px 0 0;font-weight:500}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{flex:1 1 auto;min-height:48px;font:inherit;font-size:15px;font-weight:500;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chips[aria-label=Comuna]{display:grid;grid-template-columns:1fr 1fr}
.btn{min-height:52px;font:inherit;font-size:17px;font-weight:600;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px;cursor:pointer;width:100%}
.btn.main{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.small{min-height:44px;font-size:15px;font-weight:500}
.btn:active{transform:scale(.99)}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-height:60px;cursor:pointer}
.item b{font-weight:600}.item small{color:var(--muted);display:block;font-size:13px}
.tag{font-size:12px;font-weight:500;border-radius:6px;padding:3px 8px;white-space:nowrap}
.tag.warn{background:var(--warn-bg);color:var(--warn)}.tag.ok{background:var(--ok-bg);color:var(--ok)}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.bar>div{max-width:440px;margin-inline:auto}
.back{align-self:flex-start;font:inherit;font-size:15px;font-weight:500;color:var(--accent);background:none;border:0;padding:8px 0;cursor:pointer;min-height:44px}
.hours{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.hours.two{grid-template-columns:1fr 1fr}
.hours div{background:var(--field);border-radius:8px;padding:8px 4px}
.hours b{display:block;font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.hours span{font-size:12px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin:0}
.toast{position:fixed;left:16px;right:16px;bottom:96px;max-width:408px;margin-inline:auto;background:var(--ink);color:var(--bg);border-radius:8px;padding:12px 14px;font-weight:500;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.btn[disabled]{opacity:.6}
.arow{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:8px 8px 8px 14px;min-height:60px}
.arow.ok{background:var(--ok-bg);border-color:transparent}
.aname{min-width:0}.aname b{font-family:var(--display);font-size:20px;display:block;line-height:1.1}
.aname small{color:var(--muted);font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arow.ok .aname small{color:var(--ok);font-weight:500}
.abtn{font:inherit;font-weight:600;font-size:16px;color:var(--accent);background:var(--surface);border:2px dashed var(--accent);border-radius:8px;min-height:48px;padding:0 14px;cursor:pointer;white-space:nowrap}
.alink{font:inherit;font-weight:500;font-size:15px;color:var(--accent);background:none;border:0;min-height:48px;padding:0 10px;cursor:pointer}
body{-webkit-text-size-adjust:100%}
.foot{font-size:13px;color:var(--muted);text-align:center;margin:6px 0 0}
.lnk{color:var(--accent);font-weight:600;text-decoration:underline}
.okmsg{background:var(--ok-bg);color:var(--ok);border-radius:8px;padding:10px 12px;font-size:14px;font-weight:500;margin:0}

/* Fotos de antes y después */
.btn.ico{display:flex;align-items:center;justify-content:center;gap:10px;border:2px dashed var(--accent);color:var(--accent);background:var(--surface)}
.fotos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.th{position:relative;aspect-ratio:3/4;border:1px solid var(--line);border-radius:8px;background:var(--field);padding:0;overflow:hidden;cursor:pointer;display:block;min-width:0}
.th img{width:100%;height:100%;object-fit:cover;object-position:50% 100%;display:block}
.th .st{position:absolute;right:5px;top:5px;min-width:26px;height:26px;border-radius:13px;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 6px;box-shadow:0 0 0 2px rgba(0,0,0,.35)}
.st.ok{background:var(--ok-bg);color:var(--ok)}.st.pen{background:var(--warn-bg);color:var(--warn)}.st.bad{background:var(--err);color:var(--surface)}
.th.add{border:2px dashed var(--accent);color:var(--accent);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font:inherit;font-weight:600;font-size:15px}
/* Cámara y visor: pantalla completa, siempre oscuros */
.cam,.vis{position:fixed;inset:0;z-index:50;background:#000;color:#fff;display:flex;flex-direction:column}
.cam[hidden],.vis[hidden]{display:none}
body.cam-open{overflow:hidden}
.cam-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0px))}
.cam-top .cam-x{justify-self:start}
.cam-top b{font-family:var(--display);font-size:22px;letter-spacing:.03em;font-weight:700}
.cam-x{font:inherit;font-size:15px;font-weight:600;color:#fff;background:rgba(255,255,255,.14);border:0;border-radius:8px;min-height:44px;padding:0 14px;cursor:pointer}
.cam-n{justify-self:end;text-align:right;font-size:14px;font-weight:500;color:#cfd8d2}
.cam-gps{display:flex;align-items:center;gap:8px;padding:8px 14px;font-size:14px;font-weight:500;line-height:1.25}
.cam-gps[hidden]{display:none}
.cam-gps.ok{background:#14502F;color:#DCEFE2}.cam-gps.wait{background:#3A2E10;color:#F0C25E}.cam-gps.bad{background:#5A2020;color:#F7CACA}
.cam-gps.clk{padding:5px 14px;font-size:13px;border-top:1px solid rgba(255,255,255,.12)}
.cam-gps .dot{flex:0 0 auto}
.cam-msg b{font-weight:600}
.cam-stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#000}
.cam-frame{position:relative}
.cam-frame video,.cam-frame canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.cam-frame [hidden]{display:none}
.cam-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:28px;font-size:17px;line-height:1.4}
.cam-msg[hidden]{display:none}
.cam-bot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px calc(14px + env(safe-area-inset-bottom,0px));background:#000;min-height:104px}
.cam-bot .btn{background:rgba(255,255,255,.14);border-color:transparent;color:#fff}
.cam-bot .btn.main{background:var(--accent);color:var(--on-accent)}
.cam-hint{flex:1 1 0;font-size:14px;color:#cfd8d2;min-width:0}
.cam-ok{flex:1 1 0;font:inherit;font-size:17px;font-weight:600;color:#fff;background:rgba(255,255,255,.14);border:0;border-radius:10px;min-height:52px;padding:0 12px;cursor:pointer;max-width:120px;margin-left:auto}
.shutter{flex:0 0 auto;width:78px;height:78px;border-radius:50%;border:5px solid #fff;background:rgba(255,255,255,.22);cursor:pointer;padding:0;position:relative}
.shutter::after{content:"";position:absolute;inset:6px;border-radius:50%;background:#fff}
.shutter:active::after{inset:9px}
.shutter[disabled]{opacity:.35;cursor:not-allowed}
.vis .cam-stage img{max-width:100%;max-height:100%;object-fit:contain}
/* Teléfono acostado: la imagen ocupa todo el alto y los botones pasan a una columna a la derecha */
@media (orientation:landscape) and (max-height:520px){
  .cam{display:grid;grid-template-columns:minmax(0,1fr) 116px;grid-template-rows:auto auto auto minmax(0,1fr)}
  .cam>.cam-top{grid-column:1;grid-row:1;padding:4px 10px;padding-top:calc(4px + env(safe-area-inset-top,0px));padding-left:calc(10px + env(safe-area-inset-left,0px))}
  .cam>.cam-top b{font-size:18px}
  .cam>.cam-x{min-height:36px}
  .cam>#cam-gps{grid-column:1;grid-row:2;padding:4px 12px;padding-left:calc(12px + env(safe-area-inset-left,0px));font-size:13px}
  .cam>#cam-clk{grid-column:1;grid-row:3;padding:3px 12px;padding-left:calc(12px + env(safe-area-inset-left,0px));font-size:12px}
  .cam>.cam-stage{grid-column:1;grid-row:4}
  .cam>.cam-bot{grid-column:2;grid-row:1/5;flex-direction:column;justify-content:center;gap:10px;min-height:0;padding:8px 12px;padding-right:calc(12px + env(safe-area-inset-right,0px))}
  .cam-bot .btn{width:100%;min-height:44px;padding:0 6px;font-size:15px}
  .cam-bot .cam-hint{flex:0 0 auto;text-align:center;font-size:12px}
  .cam-ok{flex:0 0 auto;width:100%;max-width:none;margin:0;min-height:44px;font-size:15px}
  .shutter{width:66px;height:66px}
  .cam-msg{padding:12px 20px;font-size:15px}
  .cam-top .cam-x{min-height:36px;padding:0 10px}
}
::placeholder{color:var(--ph);opacity:1}
.brand{background:var(--brand);margin:-22px -24px 14px;padding-top:env(safe-area-inset-top,0px);border-bottom:4px solid var(--brand-y)}
.brand>div{width:min(100%,488px);margin-inline:auto;padding:0 24px;height:56px;display:flex;align-items:center}
.brand img{display:block;height:30px;width:auto;margin-left:-6px}
</style>
</head>
<body>
<header class="brand"><div><img src="logo-cooprel.png" alt="COOPREL" width="136" height="30"></div></header>
<main class="app" id="app"></main>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script src="config.js"></script>
<script>
var CFG=window.APP_CONFIG||{};
var VER="6", PTRE=/^R\d{6}$/, KEY="faenas-app-v1";
var SEND=["Fecha","PT","ID","Propietario","Alimentador","Comuna","Sector","Poste_Inicio","Poste_Fin","Hora_Inicio","Hora_Termino","Kilometraje","Tala_20_30","Tala_31_60","Tala_Mas_60","Poda","Roce_Debil","Roce_Fuerte"];
var ALIM=["1","2","3","4","5"], COMUNAS=["La Unión","Río Bueno","Lago Ranco","San Pablo"];
var PROD=[["Tala_20_30","Tala 20 a 30 m","n"],["Tala_31_60","Tala 31 a 60 m","n"],["Tala_Mas_60","Tala más de 60 m","n"],["Poda","Poda","n"],["Roce_Debil","Roce débil (m)","d"],["Roce_Fuerte","Roce fuerte (m)","d"]];
/* Brigadas de levantamiento: en vez de producción anotan lo que hay DENTRO y FUERA de la faja de seguridad (no hay poda). Los nombres de los datos los lee el servidor (filaLev_ en Code.gs). */
var SEND_LEV=["Fecha","PT","ID","Propietario","Fono","Alimentador","Comuna","Sector","Poste_Inicio","Poste_Fin","Hora_Inicio","Hora_Termino","Kilometraje",
  "Dentro_Tala_20_30","Dentro_Tala_31_60","Dentro_Tala_Mas_60","Dentro_Roce_Debil","Dentro_Roce_Fuerte","Fuera_Tala_20_30","Fuera_Tala_31_60","Fuera_Tala_Mas_60","Especie"];
var DENTRO=[["Dentro_Tala_20_30","Tala 20 a 30 m","n"],["Dentro_Tala_31_60","Tala 31 a 60 m","n"],["Dentro_Tala_Mas_60","Tala más de 60 m","n"],["Dentro_Roce_Debil","Roce débil (m)","d"],["Dentro_Roce_Fuerte","Roce fuerte (m)","d"]];
var FUERA=[["Fuera_Tala_20_30","Tala 20 a 30 m","n"],["Fuera_Tala_31_60","Tala 31 a 60 m","n"],["Fuera_Tala_Mas_60","Tala más de 60 m","n"]];
var LEVN=DENTRO.concat(FUERA).map(function(q){return q[0]});
var S={recs:[],dels:[],dq:[],pq:[],lc:0,lastOk:0,copied:false,docSyncing:false,docErr:"",fotoSyncing:false,fotoErr:"",day:null,profile:null,view:"home",sel:null,draft:{},err:{},busy:false,syncing:false,syncErr:"",confirmDel:false,editing:false,afterDay:false};
var $app=document.getElementById("app");

function cobraKm(){return !!(S.profile&&S.profile.Km)}
function kmField(){return cobraKm()?'<div><label class="lbl" for="f-km">Kilometraje del día (km)</label><input id="f-km" type="text" inputmode="decimal" autocomplete="off" value="'+esc(S.draft.km)+'">'+errOf("km")+'<p class="note" style="margin-top:4px">Tu brigada cobra kilometraje. Se anota una sola vez al día.</p></div>':""}
function kmLine(b){return cobraKm()?'<p class="note">Kilometraje del día: <b>'+(b&&b.km?esc(b.km)+" km":"sin registrar")+"</b></p>":""}
/* Tipo de brigada: "forestal" (tala y roce; es lo normal) o "levantamiento". Lo dice el servidor al entrar con el código.
   Cada registro guarda su tipo en _t ("l" = levantamiento; lo que no lo trae es forestal, como los de la versión anterior), así nunca se mezclan. */
function isLev(){return !!(S.profile&&S.profile.Tipo==="levantamiento")}
function tipoDe(r){return r&&r._t==="l"?"l":"f"}
function tipoMio(){return isLev()?"l":"f"}
function nombreTipo(t){return t==="l"||t==="levantamiento"?"levantamiento":"forestal"}
/* El servidor dijo de qué tipo es de verdad esta brigada (el administrador la pudo cambiar después de que entraron al teléfono).
   Si es la brigada de este teléfono, la app pasa al formulario que corresponde y vuelve al inicio. Los registros del otro tipo no se pierden ni se mezclan: quedan guardados sin enviar. */
function tipoNota(c,t){
  if(!S.profile||S.profile.Codigo!==c||(t!=="levantamiento"&&t!=="forestal")||S.profile.Tipo===t)return false;
  S.profile.Tipo=t;persist();
  if(!CAM){S.editing=false;S.confirmDel=false;S.view="home";S.sel=null;S.draft={};S.err={}}
  return true;
}

function p2(n){return String(n).padStart(2,"0")}
function isoOf(d){return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())}
function today(){return isoOf(new Date())}
function daysAgo(n){var d=new Date();d.setDate(d.getDate()-n);return isoOf(d)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function blank(){var r={};(isLev()?SEND_LEV:SEND).forEach(function(c){r[c]=""});r._t=tipoMio();return r}
function touch(r){r.synced=false;r._v=(r._v||0)+1}

function load(){
  try{var v=localStorage.getItem(KEY);if(v){var o=JSON.parse(v);
    S.recs=o.recs||[];S.dels=o.dels||[];S.dq=o.dq||[];S.pq=o.pq||[];S.lc=o.lc||0;S.profile=o.profile||null;S.day=o.day||null;S.lastOk=o.lastOk||0;limpiaMalas();
    var cut=daysAgo(14);S.recs=S.recs.filter(function(r){return !r.synced||r.Fecha>=cut})}}catch(e){}
}
function persist(){try{localStorage.setItem(KEY,JSON.stringify({recs:S.recs,dels:S.dels,dq:S.dq,pq:S.pq,profile:S.profile,day:S.day,lastOk:S.lastOk,lc:S.lc}))}catch(e){}}
function save(){persist();scheduleSync()}
function mine(){return S.recs.filter(function(r){return r.Fecha===today()&&S.profile&&r._c===S.profile.Codigo&&tipoDe(r)===tipoMio()})}
function dayInfo(){return S.day&&S.day.fecha===today()?S.day:null}
function applyDay(){
  var d=dayInfo();if(!d)return;
  mine().forEach(function(r,i){
    var nv={PT:d.PT,ID:d.ID,Hora_Inicio:i===0?(d.hi||""):"",Hora_Termino:i===0?(d.ht||""):"",Kilometraje:i===0&&cobraKm()?(d.km||""):""};
    var ch=false;Object.keys(nv).forEach(function(k){if(String(r[k]||"")!==String(nv[k])){r[k]=nv[k];ch=true}});
    if(ch)touch(r);
  });
}
function real(){return mine().filter(function(r){return !r._day})}
function ensureDayRow(){
  var d=dayInfo();if(!d||mine().length)return;
  var r=blank();r.Fecha=today();r.PT=d.PT;r.ID=d.ID;r._day=true;
  r._k="k"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);r._c=S.profile.Codigo;
  touch(r);S.recs.push(r);applyDay();
}
function hasProd(r){
  if(tipoDe(r)==="l")return !!String(r.Especie||"").trim()||LEVN.some(function(k){return r[k]!==""&&r[k]!=null});
  return PROD.some(function(q){return r[q[0]]!==""&&r[q[0]]!=null});
}
function pending(){return real().filter(function(r){return !hasProd(r)})}
function unsynced(){return S.recs.filter(function(r){return !r.synced}).length+S.dels.length+S.dq.length+fotosPend().length}
function hhmm(t){var d=new Date(t);return p2(d.getHours())+":"+p2(d.getMinutes())}

function api(payload,ms){

  var t0=Date.now();

    .then(function(r){clearTimeout(to);return r.json()})

}

})})}

/* Fecha y hora SIEMPRE en hora de Chile, aunque el teléfono tenga otra zona horaria configurada. */
var DTF=null;
function chile(t){
  var o={};
  try{
    if(!DTF)DTF=new Intl.DateTimeFormat("en-GB",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"});
    DTF.formatToParts(new Date(t)).forEach(function(q){o[q.type]=q.value});
    if(o.hour==="24")o.hour="00";
  }catch(e){var d=new Date(t);o={day:p2(d.getDate()),month:p2(d.getMonth()+1),year:String(d.getFullYear()),hour:p2(d.getHours()),minute:p2(d.getMinutes()),second:p2(d.getSeconds())}}
  return o;
}

/* ----- Hora oficial ----- */
/* RELOJ.off = hora del servidor − hora del teléfono (ms), medida cuando la hora del teléfono era RELOJ.at. Cada respuesta del servidor
   trae su hora (api() la anota); además la cámara la pregunta al abrirse y cada 40 s. Una medida sirve 2 minutos. */
var RELOJ={off:0,at:0};
function relojNota(srv,t0,t1){
  if(!isFinite(srv))return;
  if(srv>(S.lc||0)){S.lc=srv;persist()}                 /* S.lc = última hora que dio el servidor: la foto no puede ser anterior */
  if(t1-t0>3000)return;                                  /* respuesta lenta: sirve como contacto, no para medir la diferencia */
  RELOJ.off=Math.round(srv-(t0+t1)/2);RELOJ.at=t1;
}
function relojFresco(){return !!RELOJ.at&&Date.now()-RELOJ.at<=RELOJ_VIVO}
function ahora(){var n=Date.now(),ok=relojFresco()&&Math.abs(RELOJ.off)<=TOL_RELOJ;return{t:n+(ok?RELOJ.off:0),vf:ok,dev:n}}
function durTxt(ms){
  var m=Math.round(Math.abs(ms)/60000);if(m<1)return "menos de 1 minuto";if(m<60)return m+(m===1?" minuto":" minutos");
  var h=Math.floor(m/60),mm=m%60;if(h<24)return h+(h===1?" hora":" horas")+(mm?" "+mm+" min":"");
  var d=Math.floor(h/24),hh=h%24;return d+(d===1?" día":" días")+(hh?" "+hh+" h":"");
}
/* Estado del reloj para la cámara: ok (verificado con el servidor) · sin (sin señal: se usa el reloj del teléfono) · mide (preguntando) · mala (corrido: no deja sacar fotos). */
function relojEstado(){
  if(relojFresco())return Math.abs(RELOJ.off)>TOL_RELOJ?"mala":"ok";
  return CAM&&CAM.rk==="mide"?"mide":"sin";
}
function relojMedir(){
  if(!CAM)return;
  if(CAM.rk==="mide"&&Date.now()-CAM.rkT<RELOJ_ESPERA+500)return;
  if(!navigator.onLine||!CFG.API_URL){RELOJ.at=0;CAM.rk="";camUi();return}
  CAM.rk="mide";CAM.rkT=Date.now();camUi();
  api({action:"hora"},RELOJ_ESPERA).then(function(res){
    if(!res||!res.ok||!isFinite(res.now))RELOJ.at=0;      /* sin respuesta: se vuelve a "sin señal" */
    if(CAM){CAM.rk="";camUi()}
  }).catch(function(){RELOJ.at=0;if(CAM){CAM.rk="";camUi()}});
}
/* Huella digital (SHA-256) de la foto terminada. El servidor la recalcula al recibirla. */
function sha256(blob){return new Promise(function(res){
  try{
    if(!(window.crypto&&crypto.subtle&&window.FileReader))return res("");
    var f=new FileReader();
    f.onload=function(){crypto.subtle.digest("SHA-256",f.result).then(function(b){var a=new Uint8Array(b),h="";for(var i=0;i<a.length;i++)h+=(a[i]<16?"0":"")+a[i].toString(16);res(h)},function(){res("")})};
    f.onerror=function(){res("")};f.readAsArrayBuffer(blob);
  }catch(e){res("")}
})}
function fPos(p){return p?"Ubicación: "+p.lat.toFixed(6)+", "+p.lon.toFixed(6)+"  (±"+Math.round(p.acc)+" m)":"Sin ubicación"}
function rrect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath()}

/* Dibuja los datos en la franja de abajo. Es la MISMA función para lo que se ve en la cámara y para la foto que se guarda.
   Líneas: fecha y hora (+ ANTES/DESPUÉS) · contratista, brigada e ID del proyecto · ubicación.
   Si el nombre de la empresa es tan largo que no cabe todo en una línea, el ID del proyecto pasa a una línea propia. */
function sello(cv,info){
  var c=cv.getContext("2d"),w=cv.width,h=cv.height,s=Math.min(w,h)/28,pad=Math.round(s*.6),lh=Math.round(s*1.36),fam='"Barlow","Barlow Condensed",Arial,sans-serif',maxW=w-pad*2;
  var quien=info.empresa+" · "+info.brigada,idp=info.proyecto?"ID proyecto "+info.proyecto:"",junto=idp?quien+" · "+idp:quien;
  c.save();c.font="500 "+Math.round(s)+"px "+fam;
  var L=[fFecha(info.t)+"   "+fHora(info.t)];
  if(idp&&c.measureText(junto).width>maxW){L.push(quien);L.push(idp)}else L.push(junto);
  L.push(fPos(info.pos));
  var bh=pad*2+lh*L.length,y0=h-bh;
  c.fillStyle="rgba(0,0,0,.70)";c.fillRect(0,y0,w,bh);c.textBaseline="middle";c.textAlign="left";
  var FX=FASES[info.fase]||FASES.despues,tx=FX.cam;c.font="700 "+Math.round(s*1.05)+"px "+fam;
  var cw=Math.round(c.measureText(tx).width+s*1.3),ch=Math.round(lh*.86),cx=w-pad-cw,cy=Math.round(y0+pad+lh*.5-ch/2);
  c.fillStyle=FX.col;rrect(c,cx,cy,cw,ch,Math.round(ch*.28));c.fill();
  c.fillStyle="#10201A";c.textAlign="center";c.fillText(tx,cx+cw/2,cy+ch/2+1);
  c.textAlign="left";
  for(var i=0;i<L.length;i++){
    c.fillStyle=(i===L.length-1&&!info.pos)?"#F0C25E":"#fff";
    if(i===0)fitFont(c,L[i],"600",s*1.25,cx-pad*2,fam);else fitFont(c,L[i],"500",s,maxW,fam);
    c.fillText(L[i],pad,y0+pad+lh*(i+.5));
  }
  c.restore();
}

function limpiarFotos(){

  idbDo("readonly",function(s){return s.getAllKeys()}).then(function(keys){

  }).catch(function(){});

function sync(){
  syncDocs();syncFotos();
  if(S.syncing||!navigator.onLine||!CFG.API_URL||!S.profile&&!S.recs.length&&!S.dels.length)return;
  var groups={};
  function grp(c,t){var k=c+"|"+t;return groups[k]||(groups[k]={c:c,t:t,u:[],d:[]})}
  S.recs.forEach(function(r){if(!r.synced)grp(r._c,tipoDe(r)).u.push(r)});
  S.dels.forEach(function(x){grp(x.c,x.t==="l"?"l":"f").d.push(x)});
  var codes=Object.keys(groups);
  if(!codes.length){if(S.syncErr){S.syncErr="";if(S.view==="home")render()}return}
  S.syncing=true;
  var chain=Promise.resolve(),err="";
  codes.forEach(function(key){chain=chain.then(function(){
    var g=groups[key],vs=g.u.map(function(r){return r._v});
    return api({action:"sync",codigo:g.c,tipo:nombreTipo(g.t),upserts:g.u.map(wire),deletes:g.d.map(function(x){return x.k})}).then(function(res){
      if(res&&!res.ok&&res.error==="tipo"){        /* la brigada es del otro tipo: estos registros no se envían (quedan guardados) y los demás grupos siguen */

      g.u.forEach(function(r,i){if(r._v===vs[i])r.synced=true});
      S.dels=S.dels.filter(function(x){return g.d.indexOf(x)<0});S.lastOk=Date.now();
    });

  chain.catch(function(e){err=e&&e.code==="codigo"?"codigo":"red"}).then(function(){

function levCards(){

  h+='<section class="card"><h2>Fuera de faja</h2><p class="note">Lo que hay fuera de la faja de seguridad. Lo que no encontraste, déjalo vacío.</p>'+grid(FUERA,S.draft)+'</section>';
  h+='<section class="card"><h2>Especie</h2><p class="note">Escribe la especie o las especies que hay en el tramo, separadas por coma. Si no hay árboles, escribe «Pradera».</p>'+field("Especie","Especie",{ph:"Ej: Hualle, Coihue",max:200})+errOf("prod")+'</section>';
  return h;
}
/* Atajo: el último propietario que se anotó hoy (en los recorridos reales, 7 de cada 10 tramos seguidos tienen el mismo). Solo lo copia si se toca. */
function propAnterior(){
  var rs=real().filter(function(r){return r._k!==S.sel&&String(r.Propietario||"").trim()});
  return rs.length?rs[rs.length-1]:null;
}
function propAtajo(){
  var p=S.editing?null:propAnterior();
  return p?'<button type="button" class="btn small" data-act="prop-igual">Igual al anterior: '+esc(p.Propietario)+'</button>':"";
}
function viewNew(){
  var h='<button class="back" data-act="home">‹ Volver</button><h1>'+(S.editing?"Corregir postes":"Agregar postes")+'</h1><p class="sub">'+esc(S.profile.Empresa)+' · '+esc(S.profile.Brigada)+' · N° de PT '+esc(dayInfo().PT)+' · ID '+esc(dayInfo().ID)+'</p>';
  h+='<section class="card">';
  if(S.copied&&!S.editing)h+='<p class="okmsg">Copiamos la comuna, el sector y el alimentador del registro anterior. <b>Cambia solo lo que sea distinto.</b></p>';
  h+='<div><span class="lbl">Comuna</span>'+chips("Comuna",COMUNAS)+errOf("Comuna")+'</div>';
  h+=field("Sector","Sector",{ph:"Nombre del sector"});
  h+='<div><span class="lbl">Alimentador</span>'+chips("Alimentador",ALIM)+errOf("Alimentador")+'</div>';
  h+='<div class="grid2">'+field("Poste_Inicio","Poste inicio",{mode:"numeric",ph:"1"})+field("Poste_Fin","Poste fin",{mode:"numeric",ph:"2"})+'</div>';
  if(isLev()){
    h+=field("Propietario","Propietario",{ph:"Nombre y apellido"})+propAtajo()+field("Fono","Fono del propietario",{mode:"tel",ph:"912345678"});
    h+='<p class="note">Si no pudiste saber quién es el propietario o su fono, déjalos vacíos.</p>';
  }else{
    h+=field("Propietario","Propietario del poste",{ph:"Nombre y apellido"});
    h+='<p class="note">Es el dueño del poste donde trabajas. Escríbelo en cada registro, porque puede cambiar de un poste a otro.</p>';
  }
  h+='</section>';
  if(isLev())h+='<p class="note">Si ya hiciste el levantamiento de estos postes, anótalo ahora. Si no, déjalo vacío y lo completas después desde «Postes por completar».</p>'+levCards();
  else h+='<section class="card"><h2>Producción</h2><p class="note">Si ya hiciste el trabajo, anótalo ahora. Si no, déjalo vacío y lo completas después desde Pendientes.</p>'+prodGrid(S.draft)+'</section>';
  h+='<button class="btn main" data-act="save-new">'+(S.editing?"Guardar cambios":"Guardar")+'</button>';
  return h;
}
function viewFinish(){
  var r=S.recs.filter(function(x){return x._k===S.sel})[0];
  if(!r)return '<button class="back" data-act="home">‹ Volver</button><p>No se encontró el registro.</p>';
  var h='<button class="back" data-act="home">‹ Volver</button><h1>Postes '+esc(r.Poste_Inicio)+' a '+esc(r.Poste_Fin)+'</h1><p class="sub">'+esc(r.Comuna)+' · '+esc(r.Sector)+'</p>';
  if(tipoDe(r)==="l"){
    h+=fotoCard(r,"levantamiento")+levCards();
    h+='<button class="btn main" data-act="save-finish">Guardar levantamiento</button>';
    h+='<button class="btn small" data-act="edit">Corregir postes, comuna, sector, propietario o fono</button>';
  }else{
    h+=fotoCard(r,"antes")+fotoCard(r,"despues");
    h+='<section class="card"><h2>Producción</h2>'+prodGrid(S.draft);
    h+='<p class="note">Escribe solo lo que hiciste. Lo demás déjalo vacío. Si no hiciste nada en este poste, escribe 0 en cualquiera.</p>'+errOf("prod")+'</section>';
    h+='<button class="btn main" data-act="save-finish">Guardar producción</button>';
    h+='<button class="btn small" data-act="edit">Corregir postes, comuna, sector o propietario</button>';
  }
  h+=S.confirmDel?'<div class="card"><p style="margin:0">¿Borrar estos postes? No se puede deshacer.'+((r.fotos||[]).length?' Las fotos de este tramo no se borran: quedan guardadas como respaldo.':'')+'</p><div class="grid2"><button class="btn small" data-act="del-no">No, volver</button><button class="btn small main" data-act="del-yes">Sí, borrar</button></div></div>':'<button class="btn small" data-act="del">Borrar estos postes</button>';
  return h;
}
function viewDay(){
  var h='<button class="back" data-act="home">‹ Volver</button><h1>Datos del día</h1><p class="sub">Se anotan una sola vez al día.</p>';
  h+='<section class="card"><div class="grid2">'+field("PT","N° de PT",{ph:"R011026",caps:1})+field("ID","ID",{mode:"text",ph:"Ej: 9776"})+'</div><p class="note">El N° de PT es una R y 6 números. Ejemplo: R011026.</p></section>';
  h+='<section class="card"><div class="grid2"><div><label class="lbl" for="f-hi">Hora de inicio</label><input id="f-hi" type="text" inputmode="numeric" maxlength="5" autocomplete="off" placeholder="08:45" value="'+esc(S.draft.hi)+'">'+errOf("hi")+'</div><div><label class="lbl" for="f-ht">Hora de término</label><input id="f-ht" type="text" inputmode="numeric" maxlength="5" autocomplete="off" placeholder="14:35" value="'+esc(S.draft.ht)+'">'+errOf("ht")+'</div></div><p class="note">Escribe solo números. Ejemplo: 812 queda 08:12.</p>'+kmField()+'</section>';
  h+='<p class="note">Lo que falte lo puedes completar después.</p><button class="btn main" data-act="save-day">Guardar</button>';
  return h;
}
function viewSetup(){
  var first=!S.profile;
  var h=(first?'':'<button class="back" data-act="home">‹ Volver</button>')+'<h1>Mi brigada</h1><p class="sub">'+(first?'Escribe el código que te dio tu empresa. Solo se pide una vez; la app lo recuerda.':'Cambia el código solo si te asignaron a otra brigada.')+'</p>';
  h+='<section class="card">'+field("Codigo","Código de brigada",{ph:"Ej: TER1-123456",caps:1})+'<p class="note">Necesitas internet solo para este paso.</p></section>';
  h+='<button class="btn main" data-act="save-profile"'+(S.busy?' disabled':'')+'>'+(S.busy?'Verificando…':'Entrar')+'</button>';
  return h;
}
function render(){
  if(!S.profile&&S.view!=="setup"){S.view="setup"}
  var v=S.view;
  $app.innerHTML=v==="setup"?viewSetup():v==="home"?viewHome():v==="new"?viewNew():v==="finish"?viewFinish():viewDay();
  hydrate();
}

/* ---------- Guardado ---------- */
function normHora(v){var g=String(v||"").replace(/\D/g,"");return g.length===3?"0"+g[0]+":"+g.slice(1):g.length===4?g.slice(0,2)+":"+g.slice(2):v}
function saveDay(){
  var d=S.draft,e={};d.hi=normHora(d.hi);d.ht=normHora(d.ht);
  d.ID=(d.ID||"").trim();
  if(!PTRE.test(d.PT||""))e.PT="El N° de PT es una R y 6 números. Ejemplo: R011026.";
  if(!d.ID)e.ID="Escribe el ID.";
  if(cobraKm()&&d.km&&isNaN(parseFloat(d.km)))e.km="Escribe los kilómetros con números.";
  var HRE=/^([01]\d|2[0-3]):[0-5]\d$/;
  if(d.hi&&!HRE.test(d.hi))e.hi="Escribe la hora con números. Ejemplo: 845 o 0845.";
  if(d.ht&&!HRE.test(d.ht))e.ht="Escribe la hora con números. Ejemplo: 1435.";
  if(!e.hi&&!e.ht&&d.hi&&d.ht&&toMin(d.ht)<toMin(d.hi))e.ht="La hora de término es antes que la de inicio.";
  S.err=e;if(Object.keys(e).length){render();return}
  S.day={fecha:today(),PT:d.PT,ID:d.ID,hi:d.hi||"",ht:d.ht||"",km:cobraKm()?(d.km||""):""};
  applyDay();ensureDayRow();save();
  var next=S.afterDay;S.afterDay=false;
  if(next){newDraft();go("new")}else{toast("Datos del día guardados");go("home")}
}
function newDraft(){
  var d={};
  claves(isLev()).forEach(function(k){d[k]=""});
  /* Del registro anterior de hoy se copian SOLO comuna, sector y alimentador (los postes no son siempre correlativos). */
  var rs=real(),p=rs.length?rs[rs.length-1]:null;
  S.copied=!!(p&&p.Comuna&&p.Sector&&p.Alimentador);
  if(S.copied){d.Comuna=p.Comuna;d.Sector=p.Sector;d.Alimentador=p.Alimentador}
  S.draft=d;
}
var EDIT=["Alimentador","Comuna","Sector","Poste_Inicio","Poste_Fin","Propietario"];
/* Los datos de un registro que se escriben en los formularios (cambian según el tipo de brigada). */
function claves(lev){return lev?EDIT.concat(["Fono"],LEVN,["Especie"]):EDIT.concat(PROD.map(function(q){return q[0]}))}
/* Del formulario al registro, y del registro al formulario (todo=true incluye también los postes, la comuna, el sector y el propietario). */
function aplica(d,r){
  claves(tipoDe(r)==="l").forEach(function(k){r[k]=String(d[k]==null?"":d[k]).trim()});
}
function alForm(r,d,todo){
  var lev=tipoDe(r)==="l",ks=lev?LEVN.concat(["Especie"]):PROD.map(function(q){return q[0]});
  if(todo)ks=EDIT.concat(lev?["Fono"]:[],ks);
  ks.forEach(function(k){d[k]=r[k]==null?"":String(r[k])});
}
function saveNew(){
  var d=S.draft,e={},lev=isLev();
  ["Alimentador","Comuna"].forEach(function(k){if(!d[k])e[k]="Elige una opción."});
  (lev?["Sector"]:["Sector","Propietario"]).forEach(function(k){if(!String(d[k]||"").trim())e[k]="Este dato es obligatorio."});
  ["Poste_Inicio","Poste_Fin"].forEach(function(k){if(!d[k])e[k]="Escribe un número."});
  S.err=e;
  if(Object.keys(e).length){render();var f=document.querySelector(".err");if(f)f.scrollIntoView({block:"center"});return}
  if(S.editing){
    var r0=S.recs.filter(function(x){return x._k===S.sel})[0];
    aplica(d,r0);
    touch(r0);save();toast("Cambios guardados");go("home");return
  }
  var dr=mine().filter(function(x){return x._day})[0];
  var r=dr||blank();
  aplica(d,r);
  r.Fecha=today();r.PT=dayInfo().PT;r.ID=dayInfo().ID;
  if(dr){delete r._day}else{r._k="k"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);r._c=S.profile.Codigo;S.recs.push(r)}
  touch(r);applyDay();save();
  S.draft={};alForm(r,S.draft);
  toast(lev?(navigator.onLine?"Postes guardados. Ahora toma las fotos":"Guardado en el teléfono. Ahora toma las fotos"):(navigator.onLine?"Postes guardados. Ahora toma las fotos de antes":"Guardado en el teléfono. Ahora toma las fotos de antes"));
  go("finish",r._k);
}
function saveFinish(){
  var d=S.draft,r=S.recs.filter(function(x){return x._k===S.sel})[0];
  if(!r){go("home");return}
  if(tipoDe(r)==="l"){
    var esp=String(d.Especie||"").trim();
    if(!esp&&!LEVN.some(function(k){return d[k]!==""&&d[k]!=null})){
      S.err={prod:"Escribe la especie (si no hay árboles, escribe «Pradera») o anota al menos un dato."};render();
      var fe=document.querySelector(".err");if(fe)fe.scrollIntoView({block:"center"});return
    }
    LEVN.forEach(function(k){r[k]=d[k]||""});r.Especie=esp;
    touch(r);save();toast(navigator.onLine?"Levantamiento guardado":"Guardado en el teléfono");go("home");return
  }
  if(!PROD.some(function(q){return d[q[0]]!==""&&d[q[0]]!=null})){S.err={prod:"Escribe al menos un dato. Si no hiciste nada, escribe 0."};render();return}
  PROD.forEach(function(p){r[p[0]]=d[p[0]]||""});
  touch(r);save();toast(navigator.onLine?"Producción guardada":"Guardado en el teléfono");go("home");
}
function doLogin(){
  var c=String(S.draft.Codigo||"").trim().toUpperCase();
  if(!c){S.err={Codigo:"Escribe el código."};render();return}
  if(S.busy)return;S.busy=true;S.err={};render();
  api({action:"login",codigo:c}).then(function(res){
    S.busy=false;
    if(res&&res.ok){
      if(S.profile&&S.profile.Codigo!==c)S.day=null;
      S.profile={Codigo:c,Empresa:res.empresa,Brigada:res.brigada,Km:!!res.km,Tipo:res.tipo==="levantamiento"?"levantamiento":"forestal"};
      persist();toast("Listo. La app ya sabe quién eres");go("home");sync();
    }else{S.err={Codigo:"Ese código no existe. Revísalo o pídelo a tu empresa."};render()}
  }).catch(function(e){
    S.busy=false;
    S.err={Codigo:e&&e.code==="config"?"La app no está configurada todavía. Avisa al administrador.":"No se pudo conectar. Revisa tu señal e intenta de nuevo."};render();
  });
}

/* ---------- Eventos ---------- */
document.addEventListener("click",function(ev){
  var chip=ev.target.closest("[data-chip]");
  if(chip){var f=chip.getAttribute("data-chip");S.draft[f]=chip.getAttribute("data-val");delete S.err[f];
    chip.parentNode.querySelectorAll(".chip").forEach(function(c){c.setAttribute("aria-pressed",String(c===chip))});return}
  var b=ev.target.closest("[data-act]");if(!b)return;
  var a=b.getAttribute("data-act");
  if(a==="home")go("home");
  else if(a==="edit"){var re=S.recs.filter(function(x){return x._k===S.sel})[0];if(re){S.draft={};alForm(re,S.draft,true);S.editing=true;go("new",re._k)}}
  else if(a==="prop-igual"){var pa=propAnterior();if(pa){S.draft.Propietario=pa.Propietario;S.draft.Fono=pa.Fono||"";delete S.err.Propietario;render()}}
  else if(a==="del"){S.confirmDel=true;render()}
  else if(a==="del-no"){S.confirmDel=false;render()}
  else if(a==="del-yes"){var rd=S.recs.filter(function(x){return x._k===S.sel})[0];
    if(rd){S.recs=S.recs.filter(function(x){return x!==rd});S.dels.push({k:rd._k,c:rd._c,t:tipoDe(rd)});applyDay();ensureDayRow();save();toast("Postes borrados")}go("home")}
  else if(a==="new"){S.editing=false;if(!dayInfo()){S.afterDay=true;S.draft={PT:"",ID:"",hi:"",ht:"",km:""};go("day")}else{newDraft();go("new")}}
  else if(a==="day"){var di=dayInfo();S.afterDay=false;S.draft={PT:di?di.PT:"",ID:di?di.ID:"",hi:di?di.hi:"",ht:di?di.ht:"",km:di?di.km:""};go("day")}
  else if(a==="foto")openCam(b.getAttribute("data-fase"));
  else if(a==="ver")verFoto(b.getAttribute("data-id"));
  else if(a==="cam-x")camClose();
  else if(a==="cam-shoot")camShoot();
  else if(a==="cam-use")camUse();
  else if(a==="cam-redo"){if(CAM){CAM.shot=null;CAM.st="live";CAM.sig="";if(!camLive())camStream();camUi()}}
  else if(a==="cam-retry"){var tf=CAM&&CAM.fase;camClose();if(tf)openCam(tf)}
  else if(a==="cam-clock")relojMedir();
  else if(a==="vis-x")visClose();
  else if(a==="save-day")saveDay();
  else if(a==="save-new")saveNew();
  else if(a==="open"){var id=b.getAttribute("data-id"),r=S.recs.filter(function(x){return x._k===id})[0];
    if(r){S.draft={};alForm(r,S.draft);go("finish",id)}}
  else if(a==="save-finish")saveFinish();
  else if(a==="save-profile")doLogin();
  else if(a==="change-profile"){S.draft={Codigo:""};go("setup")}
});
document.addEventListener("focusout",function(ev){
  var t=ev.target;if(!t||(t.id!=="f-hi"&&t.id!=="f-ht"))return;
  var nv=normHora(t.value);if(nv!==t.value){t.value=nv;S.draft[t.id==="f-hi"?"hi":"ht"]=nv}
});
document.addEventListener("input",function(ev){
  var t=ev.target;
  if(t.id==="f-hi"||t.id==="f-ht"){var dg=t.value.replace(/\D/g,"").slice(0,4),hv=dg.length===4?dg.slice(0,2)+":"+dg.slice(2):dg.length===3?dg[0]+":"+dg.slice(1):dg;if(hv!==t.value)t.value=hv;var hk=t.id==="f-hi"?"hi":"ht";S.draft[hk]=hv;delete S.err[hk];var hn=t.parentNode.querySelector(".err");if(hn)hn.remove();return}
  if(t.id==="f-km"){var kv=t.value.replace(",",".").replace(/[^0-9.]/g,"").replace(/(\..*)\./g,"$1");if(kv!==t.value)t.value=kv;S.draft.km=kv;delete S.err.km;return}
  var f=t.getAttribute&&t.getAttribute("data-f");if(!f)return;
  var v=t.value;
  if(f==="PT")v=v.toUpperCase().replace(/[^R0-9]/g,"").slice(0,7);
  else if(f==="Codigo")v=v.toUpperCase().replace(/\s/g,"");
  else if(f==="Fono")v=v.replace(/\D/g,"").slice(0,15);
  else if(["Poste_Inicio","Poste_Fin"].indexOf(f)>-1||t.getAttribute("data-kind")==="n")v=v.replace(/\D/g,"");
  else if(t.getAttribute("data-kind")==="d")v=v.replace(",",".").replace(/[^0-9.]/g,"").replace(/(\..*)\./g,"$1");
  if(v!==t.value)t.value=v;
  S.draft[f]=v;delete S.err[f];
  var nx=t.parentNode.querySelector(".err");if(nx)nx.remove();
  if(LEVN.indexOf(f)>-1||(f==="Especie"&&v.trim()))avisoProdFuera();
});
document.addEventListener("keydown",function(ev){
  if(ev.key==="Enter"&&ev.target.id==="f-Codigo"){ev.preventDefault();doLogin()}
  if(ev.key==="Escape"){if(CAM)camClose();else visClose()}
});
window.addEventListener("resize",function(){if(CAM)camFit()});
window.addEventListener("online",function(){if(S.view==="home")render();sync()});
window.addEventListener("offline",function(){if(S.view==="home")render()});
document.addEventListener("visibilitychange",function(){
  if(CAM){if(document.hidden)camStop();else{if(CAM.st!=="review"&&CAM.st!=="err"){CAM.st="start";camStream();camUi()}relojMedir()}}
  if(!document.hidden){if(S.view==="home")render();sync()}
});
setInterval(function(){if(unsynced())sync()},30000);

load();
if(!S.profile){S.view="setup";S.draft={Codigo:""}}
render();sync();
setTimeout(limpiarFotos,3000);
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}

</script>
