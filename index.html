<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#238CCD">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jornada">
<title>Jornada</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="robots" content="noindex, nofollow">
<style>
/* Letras guardadas con la app: no dependen de internet ni de Google. */
@font-face{font-family:"Barlow";font-style:normal;font-weight:400;font-display:swap;src:url(font-barlow-400.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-style:normal;font-weight:500;font-display:swap;src:url(font-barlow-500.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-style:normal;font-weight:600;font-display:swap;src:url(font-barlow-600.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:600;font-display:swap;src:url(font-barlow-condensed-600.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:700;font-display:swap;src:url(font-barlow-condensed-700.woff2) format("woff2")}
/* Layout: una columna del ancho de un teléfono, centrada, con barra de acción fija abajo en la pantalla principal. */
:root{
  --bg:#EEF3F8;--surface:#FFFFFF;--field:#F5F8FB;--ink:#10202D;--muted:#4E6275;--line:#D0DBE5;
  --accent:#1969A0;--on-accent:#FFFFFF;--brand:#238CCD;--brand-y:#FDD20E;--ph:#5F7183;--warn-bg:#FBEBCB;--warn:#744600;--ok-bg:#DCEFE2;--ok:#14502F;--err:#A12A2A;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--body:"Barlow",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C151D;--surface:#15222D;--field:#101B25;--ink:#E7EFF6;--muted:#9DB2C4;--line:#2A3B4A;
  --accent:#52B0EA;--on-accent:#04192A;--brand:#238CCD;--brand-y:#FDD20E;--ph:#7F94A6;--warn-bg:#3A2E10;--warn:#F0C25E;--ok-bg:#1B3A28;--ok:#8FD6AC;--err:#F29A9A;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C151D;--surface:#15222D;--field:#101B25;--ink:#E7EFF6;--muted:#9DB2C4;--line:#2A3B4A;
  --accent:#52B0EA;--on-accent:#04192A;--brand:#238CCD;--brand-y:#FDD20E;--ph:#7F94A6;--warn-bg:#3A2E10;--warn:#F0C25E;--ok-bg:#1B3A28;--ok:#8FD6AC;--err:#F29A9A;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;padding-inline:16px;padding-block:14px 110px}
.app{max-width:440px;margin-inline:auto;display:flex;flex-direction:column;gap:14px}
h1,h2{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;line-height:1.1;text-wrap:balance}
h1{font-size:30px}h2{font-size:22px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sub{color:var(--muted);font-size:14px;margin:2px 0 0}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;border-radius:999px;padding:4px 10px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lbl{font-size:16px;font-weight:700;color:var(--ink);margin:0 0 5px;display:block}
input[type=text],input[type=time],input[type=number]{width:100%;min-height:48px;font:inherit;font-size:17px;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
input:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.err{color:var(--err);font-size:13px;margin:4px 0 0;font-weight:500}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{flex:1 1 auto;min-height:48px;font:inherit;font-size:15px;font-weight:500;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chips[aria-label=Comuna]{display:grid;grid-template-columns:1fr 1fr}
.btn{min-height:52px;font:inherit;font-size:17px;font-weight:600;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px;cursor:pointer;width:100%}
.btn.main{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.small{min-height:44px;font-size:15px;font-weight:500}
.btn:active{transform:scale(.99)}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-height:60px;cursor:pointer}
.item b{font-weight:600}.item small{color:var(--muted);display:block;font-size:13px}
.tag{font-size:12px;font-weight:500;border-radius:6px;padding:3px 8px;white-space:nowrap}
.tag.warn{background:var(--warn-bg);color:var(--warn)}.tag.ok{background:var(--ok-bg);color:var(--ok)}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.bar>div{max-width:440px;margin-inline:auto}
.back{align-self:flex-start;font:inherit;font-size:15px;font-weight:500;color:var(--accent);background:none;border:0;padding:8px 0;cursor:pointer;min-height:44px}
.hours{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.hours.two{grid-template-columns:1fr 1fr}
.hours div{background:var(--field);border-radius:8px;padding:8px 4px}
.hours b{display:block;font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.hours span{font-size:12px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin:0}
.toast{position:fixed;left:16px;right:16px;bottom:96px;max-width:408px;margin-inline:auto;background:var(--ink);color:var(--bg);border-radius:8px;padding:12px 14px;font-weight:500;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.btn[disabled]{opacity:.6}
.arow{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:8px 8px 8px 14px;min-height:60px}
.arow.ok{background:var(--ok-bg);border-color:transparent}
.aname{min-width:0}.aname b{font-family:var(--display);font-size:20px;display:block;line-height:1.1}
.aname small{color:var(--muted);font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arow.ok .aname small{color:var(--ok);font-weight:500}
.abtn{font:inherit;font-weight:600;font-size:16px;color:var(--accent);background:var(--surface);border:2px dashed var(--accent);border-radius:8px;min-height:48px;padding:0 14px;cursor:pointer;white-space:nowrap}
.alink{font:inherit;font-weight:500;font-size:15px;color:var(--accent);background:none;border:0;min-height:48px;padding:0 10px;cursor:pointer}
body{-webkit-text-size-adjust:100%}
.foot{font-size:13px;color:var(--muted);text-align:center;margin:6px 0 0}
.lnk{color:var(--accent);font-weight:600;text-decoration:underline}
.okmsg{background:var(--ok-bg);color:var(--ok);border-radius:8px;padding:10px 12px;font-size:14px;font-weight:500;margin:0}

/* Fotos de antes y después */
.btn.ico{display:flex;align-items:center;justify-content:center;gap:10px;border:2px dashed var(--accent);color:var(--accent);background:var(--surface)}
.fotos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.th{position:relative;aspect-ratio:3/4;border:1px solid var(--line);border-radius:8px;background:var(--field);padding:0;overflow:hidden;cursor:pointer;display:block;min-width:0}
.th img{width:100%;height:100%;object-fit:cover;object-position:50% 100%;display:block}
.th .st{position:absolute;right:5px;top:5px;min-width:26px;height:26px;border-radius:13px;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 6px;box-shadow:0 0 0 2px rgba(0,0,0,.35)}
.st.ok{background:var(--ok-bg);color:var(--ok)}.st.pen{background:var(--warn-bg);color:var(--warn)}.st.bad{background:var(--err);color:var(--surface)}
.th.add{border:2px dashed var(--accent);color:var(--accent);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font:inherit;font-weight:600;font-size:15px}
/* Cámara y visor: pantalla completa, siempre oscuros */
.cam,.vis{position:fixed;inset:0;z-index:50;background:#000;color:#fff;display:flex;flex-direction:column}
.cam[hidden],.vis[hidden]{display:none}
body.cam-open{overflow:hidden}
.cam-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0px))}
.cam-top .cam-x{justify-self:start}
.cam-top b{font-family:var(--display);font-size:22px;letter-spacing:.03em;font-weight:700}
.cam-x{font:inherit;font-size:15px;font-weight:600;color:#fff;background:rgba(255,255,255,.14);border:0;border-radius:8px;min-height:44px;padding:0 14px;cursor:pointer}
.cam-n{justify-self:end;text-align:right;font-size:14px;font-weight:500;color:#cfd8d2}
.cam-gps{display:flex;align-items:center;gap:8px;padding:8px 14px;font-size:14px;font-weight:500;line-height:1.25}
.cam-gps[hidden]{display:none}
.cam-gps.ok{background:#14502F;color:#DCEFE2}.cam-gps.wait{background:#3A2E10;color:#F0C25E}.cam-gps.bad{background:#5A2020;color:#F7CACA}
.cam-gps.clk{padding:5px 14px;font-size:13px;border-top:1px solid rgba(255,255,255,.12)}
.cam-gps .dot{flex:0 0 auto}
.cam-msg b{font-weight:600}
.cam-stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#000}
.cam-frame{position:relative}
.cam-frame video,.cam-frame canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.cam-frame [hidden]{display:none}
.cam-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:28px;font-size:17px;line-height:1.4}
.cam-msg[hidden]{display:none}
.cam-bot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px calc(14px + env(safe-area-inset-bottom,0px));background:#000;min-height:104px}
.cam-bot .btn{background:rgba(255,255,255,.14);border-color:transparent;color:#fff}
.cam-bot .btn.main{background:var(--accent);color:var(--on-accent)}
.cam-hint{flex:1 1 0;font-size:14px;color:#cfd8d2;min-width:0}
.cam-ok{flex:1 1 0;font:inherit;font-size:17px;font-weight:600;color:#fff;background:rgba(255,255,255,.14);border:0;border-radius:10px;min-height:52px;padding:0 12px;cursor:pointer;max-width:120px;margin-left:auto}
.shutter{flex:0 0 auto;width:78px;height:78px;border-radius:50%;border:5px solid #fff;background:rgba(255,255,255,.22);cursor:pointer;padding:0;position:relative}
.shutter::after{content:"";position:absolute;inset:6px;border-radius:50%;background:#fff}
.shutter:active::after{inset:9px}
.shutter[disabled]{opacity:.35;cursor:not-allowed}
.vis .cam-stage img{max-width:100%;max-height:100%;object-fit:contain}
/* Teléfono acostado: la imagen ocupa todo el alto y los botones pasan a una columna a la derecha */
@media (orientation:landscape) and (max-height:520px){
  .cam{display:grid;grid-template-columns:minmax(0,1fr) 116px;grid-template-rows:auto auto auto minmax(0,1fr)}
  .cam>.cam-top{grid-column:1;grid-row:1;padding:4px 10px;padding-top:calc(4px + env(safe-area-inset-top,0px));padding-left:calc(10px + env(safe-area-inset-left,0px))}
  .cam>.cam-top b{font-size:18px}
  .cam>.cam-x{min-height:36px}
  .cam>#cam-gps{grid-column:1;grid-row:2;padding:4px 12px;padding-left:calc(12px + env(safe-area-inset-left,0px));font-size:13px}
  .cam>#cam-clk{grid-column:1;grid-row:3;padding:3px 12px;padding-left:calc(12px + env(safe-area-inset-left,0px));font-size:12px}
  .cam>.cam-stage{grid-column:1;grid-row:4}
  .cam>.cam-bot{grid-column:2;grid-row:1/5;flex-direction:column;justify-content:center;gap:10px;min-height:0;padding:8px 12px;padding-right:calc(12px + env(safe-area-inset-right,0px))}
  .cam-bot .btn{width:100%;min-height:44px;padding:0 6px;font-size:15px}
  .cam-bot .cam-hint{flex:0 0 auto;text-align:center;font-size:12px}
  .cam-ok{flex:0 0 auto;width:100%;max-width:none;margin:0;min-height:44px;font-size:15px}
  .shutter{width:66px;height:66px}
  .cam-msg{padding:12px 20px;font-size:15px}
  .cam-top .cam-x{min-height:36px;padding:0 10px}
}
::placeholder{color:var(--ph);opacity:1}
.brand{background:var(--brand);margin:-22px -24px 14px;padding-top:env(safe-area-inset-top,0px);border-bottom:4px solid var(--brand-y)}
.brand>div{width:min(100%,488px);margin-inline:auto;padding:0 24px;height:56px;display:flex;align-items:center}
.brand img{display:block;height:30px;width:auto;margin-left:-6px}

/* ===== NUEVO: sugerencia del poste que sigue (vano a vano) =====
   Usa solo las variables y letras que ya tiene la app (modo claro y oscuro). */
.vz{display:flex;flex-direction:column;gap:10px}
.vz:empty{display:none}
.vano{display:flex;gap:10px;align-items:flex-start;border-radius:8px;padding:10px 12px;margin:0;font-size:14px;line-height:1.35;font-weight:500}
.vano b{font-weight:700}
.vano .ic{flex:0 0 auto;width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:14px;line-height:1;font-weight:700}
.vano.ok{background:var(--ok-bg);color:var(--ok)}
.vano.ok .ic{background:var(--ok);color:var(--ok-bg)}
.vano.warn{background:var(--warn-bg);color:var(--warn)}
.vano.warn .ic{background:var(--warn);color:var(--warn-bg)}
.vano.info{background:var(--field);color:var(--muted);border:1px solid var(--line)}
.vano.info .ic{background:var(--muted);color:var(--field);font-family:var(--body)}
.sug{display:flex;flex-direction:column;gap:6px}
.sug-t{margin:0;font-size:14px;font-weight:500;color:var(--muted)}
.sug-b{display:flex;gap:8px;flex-wrap:wrap}
.sbtn{flex:1 1 140px;min-height:52px;font:inherit;font-weight:600;color:var(--accent);background:var(--surface);border:2px dashed var(--accent);border-radius:8px;padding:0 14px;cursor:pointer;display:flex;align-items:baseline;justify-content:center;gap:8px;line-height:52px}
.sbtn b{font-family:var(--display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.sbtn small{font-size:14px;font-weight:500;color:var(--muted)}

/* ===== NUEVO: «Poste no terminado» (forestal) ===== */
.nt{display:flex;flex-direction:column;gap:8px}
.nt .lbl{margin:0}
.chips[aria-label=Terminado]{display:flex}
.chips[aria-label=Terminado] .chip{flex:1 1 0}
.chips[aria-label=Terminado] .chip:last-child[aria-pressed=true]{background:var(--warn-bg);border-color:var(--warn);color:var(--warn);font-weight:600}
.tag.go{background:var(--accent);color:var(--on-accent);font-size:14px;font-weight:600;padding:7px 12px;border-radius:8px}

/* ===== v8: comuna, sector y alimentador salen del mapa ===== */
.ubic{display:flex;flex-direction:column;gap:12px}
.ubic:empty{display:none}
.ubic-ok{background:var(--field);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.ubic-ok .lbl{margin:0;font-size:14px;color:var(--muted);font-weight:600}
.ubic-ok dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px}
.ubic-ok dt{color:var(--muted)}
.ubic-ok dd{margin:0;font-weight:700;color:var(--ink)}
/* ===== v8: botones secundarios con borde continuo (sin punteado) ===== */
.abtn,.btn.ico,.th.add,.sbtn{border:2px solid var(--accent);background:var(--surface);color:var(--accent)}
.sug-b{gap:10px}
.sbtn{flex:0 0 auto;min-height:52px;line-height:1.2;padding:10px 22px;border-radius:999px;align-items:center;gap:8px}
.sbtn b{font-family:var(--body);font-size:19px;font-weight:700;letter-spacing:0}
.sbtn small{font-size:14px}
.sbtn::after{content:"›";font-size:22px;font-weight:700;margin-left:2px}
/* ===== v8: fotos en filas chicas ===== */
.fc{gap:12px}
.frow{display:flex;flex-direction:column;gap:6px}
.frow .fl{font-weight:700;font-size:15px;color:var(--ink);line-height:1.2}
.fc small,.frow .fl small{font-weight:500;font-size:13px;color:var(--muted);margin-left:6px}
.fc .row h2 small{font-family:var(--body);letter-spacing:0}
.fth{display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.fth .th{flex:0 0 60px;width:60px;height:60px;aspect-ratio:auto;border-radius:6px}
.fth .th .st{min-width:20px;height:20px;font-size:12px;right:2px;top:2px;padding:0 3px;border-radius:10px}
.fth .fcam{flex:0 0 60px;width:60px;height:60px;border:2px solid var(--accent);border-radius:6px;background:var(--surface);color:var(--accent);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.fth .fcam svg{width:26px;height:26px}
.vis-q{display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.vis-q p{margin:0;color:#fff;font-size:15px;text-align:center}
.vis-q .grid2{width:100%;max-width:420px}
</style>
</head>

<script>
var CFG=window.APP_CONFIG||{};

var ALIM=["1","2","3","4","5"], COMUNAS=["La Unión","Río Bueno","Lago Ranco","San Pablo"];

/* Brigadas de levantamiento: en vez de producción anotan lo que hay DENTRO y FUERA de la faja de seguridad (no hay poda). Los nombres de los datos los lee el servidor (filaLev_ en Code.gs). */

  "Dentro_Tala_20_30","Dentro_Tala_31_60","Dentro_Tala_Mas_60","Dentro_Roce_Debil","Dentro_Roce_Fuerte","Fuera_Tala_20_30","Fuera_Tala_31_60","Fuera_Tala_Mas_60","Especie"];
var DENTRO=[["Dentro_Tala_20_30","Tala 20 a 30 m","n"],["Dentro_Tala_31_60","Tala 31 a 60 m","n"],["Dentro_Tala_Mas_60","Tala más de 60 m","n"],["Dentro_Roce_Debil","Roce débil (m)","d"],["Dentro_Roce_Fuerte","Roce fuerte (m)","d"]];
var FUERA=[["Fuera_Tala_20_30","Tala 20 a 30 m","n"],["Fuera_Tala_31_60","Tala 31 a 60 m","n"],["Fuera_Tala_Mas_60","Tala más de 60 m","n"]];
var LEVN=DENTRO.concat(FUERA).map(function(q){return q[0]});

  if(!S.profile||["new","finish","day"].indexOf(S.view)<0)return;
  try{localStorage.setItem(KEYB,JSON.stringify({v:S.view,sel:S.sel,ed:S.editing,cf:S.contFrom,cont:S.cont,cp:S.copied,ad:S.afterDay,d:S.draft,f:today(),c:S.profile.Codigo}))}catch(e){}
}

  var b=null;try{b=JSON.parse(localStorage.getItem(KEYB)||"null")}catch(e){}
  if(!b||!S.profile||b.f!==today()||b.c!==S.profile.Codigo||!b.d||typeof b.d!=="object"){borraBorrador();return false}
  if((b.v==="finish"||b.ed)&&!S.recs.some(function(r){return r._k===b.sel})){borraBorrador();return false}
  if(b.v==="new"&&!dayInfo()){borraBorrador();return false}

}

};

function colaDe(id){return S.pq.filter(function(q){return q.id===id})[0]}
function fotoMala(id){var q=colaDe(id);return !!(q&&q.bad&&q.bv===VER)}
function fotosMalas(){return S.pq.filter(function(q){return q.bad&&q.bv===VER})}

/* Fecha y hora SIEMPRE en hora de Chile, aunque el teléfono tenga otra zona horaria configurada. */
var DTF=null;
function chile(t){
  var o={};
  try{
    if(!DTF)DTF=new Intl.DateTimeFormat("en-GB",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"});
    DTF.formatToParts(new Date(t)).forEach(function(q){o[q.type]=q.value});
    if(o.hour==="24")o.hour="00";
  }catch(e){var d=new Date(t);o={day:p2(d.getDate()),month:p2(d.getMonth()+1),year:String(d.getFullYear()),hour:p2(d.getHours()),minute:p2(d.getMinutes()),second:p2(d.getSeconds())}}
  return o;
}

/* ----- Hora oficial ----- */
/* RELOJ.off = hora del servidor − hora del teléfono (ms), medida cuando la hora del teléfono era RELOJ.at. Cada respuesta del servidor
   trae su hora (api() la anota); además la cámara la pregunta al abrirse y cada 40 s. Una medida sirve 2 minutos. */
var RELOJ={off:0,at:0};
function relojNota(srv,t0,t1){
  if(!isFinite(srv))return;
  if(srv>(S.lc||0)){S.lc=srv;persist()}                 /* S.lc = última hora que dio el servidor: la foto no puede ser anterior */
  if(t1-t0>3000)return;                                  /* respuesta lenta: sirve como contacto, no para medir la diferencia */
  RELOJ.off=Math.round(srv-(t0+t1)/2);RELOJ.at=t1;
}
function relojFresco(){return !!RELOJ.at&&Date.now()-RELOJ.at<=RELOJ_VIVO}
function ahora(){var n=Date.now(),ok=relojFresco()&&Math.abs(RELOJ.off)<=TOL_RELOJ;return{t:n+(ok?RELOJ.off:0),vf:ok,dev:n}}
function durTxt(ms){
  var m=Math.round(Math.abs(ms)/60000);if(m<1)return "menos de 1 minuto";if(m<60)return m+(m===1?" minuto":" minutos");
  var h=Math.floor(m/60),mm=m%60;if(h<24)return h+(h===1?" hora":" horas")+(mm?" "+mm+" min":"");
  var d=Math.floor(h/24),hh=h%24;return d+(d===1?" día":" días")+(hh?" "+hh+" h":"");
}
/* Estado del reloj para la cámara: ok (verificado con el servidor) · sin (sin señal: se usa el reloj del teléfono) · mide (preguntando) · mala (corrido: no deja sacar fotos). */
function relojEstado(){
  if(relojFresco())return Math.abs(RELOJ.off)>TOL_RELOJ?"mala":"ok";
  return CAM&&CAM.rk==="mide"?"mide":"sin";
}
function relojMedir(){
  if(!CAM)return;
  if(CAM.rk==="mide"&&Date.now()-CAM.rkT<RELOJ_ESPERA+500)return;
  if(!navigator.onLine||!CFG.API_URL){RELOJ.at=0;CAM.rk="";camUi();return}
  CAM.rk="mide";CAM.rkT=Date.now();camUi();
  api({action:"hora"},RELOJ_ESPERA).then(function(res){
    if(!res||!res.ok||!isFinite(res.now))RELOJ.at=0;      /* sin respuesta: se vuelve a "sin señal" */
    if(CAM){CAM.rk="";camUi()}
  }).catch(function(){RELOJ.at=0;if(CAM){CAM.rk="";camUi()}});
}
/* Huella digital (SHA-256) de la foto terminada. El servidor la recalcula al recibirla. */
function sha256(blob){return new Promise(function(res){
  try{
    if(!(window.crypto&&crypto.subtle&&window.FileReader))return res("");
    var f=new FileReader();
    f.onload=function(){crypto.subtle.digest("SHA-256",f.result).then(function(b){var a=new Uint8Array(b),h="";for(var i=0;i<a.length;i++)h+=(a[i]<16?"0":"")+a[i].toString(16);res(h)},function(){res("")})};
    f.onerror=function(){res("")};f.readAsArrayBuffer(blob);
  }catch(e){res("")}
})}
function fPos(p){return p?"Ubicación: "+p.lat.toFixed(6)+", "+p.lon.toFixed(6)+"  (±"+Math.round(p.acc)+" m)":"Sin ubicación"}
function rrect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath()}
/* Achica la letra hasta que el texto quepa en el ancho disponible (nombres de empresa largos). */

/* Dibuja los datos en la franja de abajo. Es la MISMA función para lo que se ve en la cámara y para la foto que se guarda.
   Líneas: fecha y hora (+ ANTES/DESPUÉS) · contratista, brigada e ID del proyecto · ubicación.
   Si el nombre de la empresa es tan largo que no cabe todo en una línea, el ID del proyecto pasa a una línea propia. */
function sello(cv,info){
  var c=cv.getContext("2d"),w=cv.width,h=cv.height,s=Math.min(w,h)/27,pad=Math.round(s*.8),lh=Math.round(s*1.3),fam='"Barlow","Barlow Condensed",Arial,sans-serif',maxW=w-pad*2;
  var quien=info.empresa+" · "+info.brigada,idp=info.proyecto?"ID proyecto "+info.proyecto:"",junto=idp?quien+" · "+idp:quien;
  c.save();c.font="500 "+Math.round(s)+"px "+fam;

  if(idp&&c.measureText(junto).width>maxW){L.push(quien);L.push(idp)}else L.push(junto);
  L.push(fPos(info.pos));
  /* v8: sin franja negra. Las letras van abajo a la izquierda, blancas, con un contorno y una sombra oscuros para que se lean sobre cualquier fondo. */
  var FX=FASES[info.fase]||FASES.despues;
  L.unshift(FX.cam);
  var y=h-pad-lh*(L.length-.5);
  c.textBaseline="middle";c.textAlign="left";c.lineJoin="round";
  for(var i=0;i<L.length;i++){
    var col=i===0?FX.col:(i===L.length-1&&!info.pos)?"#F0C25E":"#fff";
    if(i===0){c.font="700 "+Math.round(s*1.05)+"px "+fam}
    else if(i===1)fitFont(c,L[i],"600",s*1.25,maxW,fam);else fitFont(c,L[i],"500",s,maxW,fam);
    c.shadowColor="rgba(0,0,0,.9)";c.shadowBlur=s*.6;c.shadowOffsetY=s*.06;c.lineWidth=Math.max(2,s*.12);c.strokeStyle="rgba(0,0,0,.7)";c.strokeText(L[i],pad,y);
    c.fillStyle=col;c.fillText(L[i],pad,y);c.shadowColor="transparent";c.shadowBlur=0;c.shadowOffsetY=0;c.fillText(L[i],pad,y);
    y+=lh;
  }
  c.restore();
}
/* Las miniaturas se leen del teléfono (IndexedDB) y se ponen en su lugar después de dibujar cada pantalla. */
function hydrate(){

  });

/* v8: una tarjeta «Fotos» con una fila por clase (antes / después, o solo levantamiento): primero la cámara y después las miniaturas, la última primero. */

  fases.forEach(function(fase){var L=fotosDe(r,fase),F=FASES[fase];
    h+='<div class="frow">'+(uno?'':'<span class="fl">'+(fase==="antes"?"Antes":"Después")+'<small>'+L.length+' · máx. '+MAXFOTOS+'</small></span>')+'<div class="fth">';
    if(L.length<MAXFOTOS)h+='<button type="button" class="fcam" data-act="foto" data-fase="'+fase+'" aria-label="'+F.btn+'">'+ICO_CAM+'</button>';
    L.slice().reverse().forEach(function(f){var m=!f.sent&&fotoMala(f.id);if(m)mala=true;h+='<button type="button" class="th" data-act="ver" data-id="'+esc(f.id)+'" aria-label="Ver foto"><img data-th="'+esc(f.id)+'" alt=""><span class="st '+(f.sent?"ok":m?"bad":"pen")+'">'+(f.sent?"✓":m?"!":"↑")+'</span></button>'});

    return idbGet(d.key).then(function(v){
      var quitar=function(){S.dq=S.dq.filter(function(x){return !(x.key===d.key&&x.ts===d.ts)});return idbGet(d.key).then(function(cur){if(cur&&cur.ts===d.ts)return idbDel(d.key)})};
      if(!v){S.dq=S.dq.filter(function(x){return x.key!==d.key});return}
      return b64(v.blob).then(function(data){
        return api({action:"doc",codigo:d.c,fecha:d.f,tipo:d.t,nombre:v.name,mime:v.type,data:data},120000);
      }).then(function(res){
        if(!res||!res.ok){
          if(res&&DOCPERM.indexOf(res.error)>-1)return quitar();         /* el servidor no lo acepta nunca: se descarta */
          var e=new Error("doc");e.code=res&&res.error;throw e}
        S.lastOk=Date.now();return quitar();
      });
    });
  })});
  chain.catch(function(e){bad=true;S.docErr=e&&e.code==="codigo"?"codigo":"red"}).then(function(){
    S.docSyncing=false;if(!bad)S.docErr="";persist();
    if(S.view==="home")render();
    if(!bad&&S.dq.length)setTimeout(syncDocs,500);
  });
}
/* Limpieza al abrir la app: se borran del teléfono las fotos y miniaturas que ya no pertenecen a ningún tramo ni están por enviar
   (por ejemplo, las de tramos de hace más de 14 días). Los archivos de documentos de la versión anterior no se tocan. */
function limpiarFotos(){
  if(CAM||!window.indexedDB||!window.IDBObjectStore||!IDBObjectStore.prototype.getAllKeys)return;
  idbDo("readonly",function(s){return s.getAllKeys()}).then(function(keys){
    if(CAM)return;
    var vivo={};
    S.recs.forEach(function(r){(r.fotos||[]).forEach(function(f){vivo[f.id]=1})});
    S.pq.forEach(function(q){vivo[q.id]=1});
    (keys||[]).forEach(function(k){var m=/^(foto|v)\|(.+)$/.exec(String(k));if(m&&!vivo[m[2]])idbDel(k).catch(function(){})});
  }).catch(function(){});
}

var syncTimer=0;
function scheduleSync(){clearTimeout(syncTimer);syncTimer=setTimeout(sync,400)}
function sync(){
  redRefresh();syncDocs();syncFotos();syncQuitadas();
  if(S.syncing||!navigator.onLine||!CFG.API_URL||!S.profile&&!S.recs.length&&!S.dels.length)return;
  var groups={};
  function grp(c,t){var k=c+"|"+t;return groups[k]||(groups[k]={c:c,t:t,u:[],d:[]})}
  S.recs.forEach(function(r){if(!r.synced)grp(r._c,tipoDe(r)).u.push(r)});
  S.dels.forEach(function(x){grp(x.c,x.t==="l"?"l":"f").d.push(x)});
  var codes=Object.keys(groups);
  if(!codes.length){if(S.syncErr){S.syncErr="";if(S.view==="home")render()}return}
  S.syncing=true;
  var chain=Promise.resolve(),err="";
  codes.forEach(function(key){chain=chain.then(function(){
    var g=groups[key],vs=g.u.map(function(r){return r._v});
    return api({action:"sync",codigo:g.c,tipo:nombreTipo(g.t),upserts:g.u.map(wire),deletes:g.d.map(function(x){return x.k})}).then(function(res){
      if(res&&!res.ok&&res.error==="tipo"){        /* la brigada es del otro tipo: estos registros no se envían (quedan guardados) y los demás grupos siguen */
        tipoNota(g.c,res.tipo);err=err||"tipo";return;
      }
      if(!res||!res.ok){var e=new Error("sync");e.code=res&&res.error;throw e}
      g.u.forEach(function(r,i){if(r._v===vs[i])r.synced=true});
      S.dels=S.dels.filter(function(x){return g.d.indexOf(x)<0});S.lastOk=Date.now();
    });
  })});
  chain.catch(function(e){err=e&&e.code==="codigo"?"codigo":"red"}).then(function(){
    S.syncing=false;S.syncErr=err;persist();
    if(S.view==="home")render();
    if(!err&&unsynced())scheduleSync();
  });
}

/* ---------- Poste siguiente: sugerencias vano a vano ---------- */
/* El servidor entrega una copia compacta de la red de postes que guarda el mapa (acción "vecinos"). Se baja una vez, se guarda en el teléfono (IndexedDB) y solo se vuelve
   a bajar cuando cambia (el servidor compara una huella). Con ella, mientras se anotan POSTE INICIO y POSTE FIN, la app sugiere el poste que sigue (los vecinos del poste de inicio,
   con los metros) y avisa —sin bloquear nada— si el poste final se salta otros postes, está lejos o no está en el mapa. Todo se calcula en el teléfono, también sin señal.
   Sin datos (nunca se bajó, o el servidor no la tiene), la pantalla queda exactamente como antes. */
var RED=null,REDTS=0,REDTRY=0,REDP=null,redBusy=false,redPedidaSinDatos=false,RED_CADA=6*3600000,RED_REINTENTO=600000,LEJOS=500,MAX_SALTOS=5,MAX_SUG=4,vanoTimer=0,vanoLast="";
var NT_SI="Sí, terminados",NT_NO="No, siguen mañana";
function numP(v){var s=String(v==null?"":v).trim();if(!/^\d{1,9}$/.test(s))return null;var n=parseInt(s,10);return n>0?n:null}
function redOk(P){return !!(P&&P.v===1&&P.h&&Array.isArray(P.i)&&Array.isArray(P.x)&&Array.isArray(P.y)&&Array.isArray(P.e)&&P.i.length>0&&P.i.length===P.x.length&&P.x.length===P.y.length&&P.e.length>=2)}
function distPos(R,i,j){var dx=R.X[i]-R.X[j],dy=R.Y[i]-R.Y[j];return Math.round(Math.sqrt(dx*dx+dy*dy))}
/* La respuesta del servidor (números de poste, posiciones y tramos en diferencias) pasa a una red lista para consultar. null si no sirve. */
function redBuild(P){
  if(!redOk(P))return null;
  var n=P.i.length,R={h:P.h,n:n,ids:new Array(n),X:new Array(n),Y:new Array(n),idx:{},dup:{},adj:new Array(n),ret:{}},id=0,x=0,y=0,a=0,b,j,k,ne=0;
  for(j=0;j<n;j++){id+=P.i[j];x+=P.x[j];y+=P.y[j];R.ids[j]=id;R.X[j]=x;R.Y[j]=y;if(R.idx[id]===undefined)R.idx[id]=j;else R.dup[id]=true}     /* un número repetido no se usa: no se sabe cuál es el poste */
  (P.d||[]).forEach(function(v){R.dup[v]=true});
  var put=function(p,q){(R.adj[p]||(R.adj[p]=[])).push(q)};
  for(k=0;k+1<P.e.length;k+=2){a+=P.e[k];b=a+P.e[k+1];if(a<0||b<0||a>=n||b>=n||a===b)continue;put(a,b);put(b,a);ne++}
  if(!ne)return null;
  for(j=0;j<n;j++)if(R.adj[j])R.adj[j].sort(function(p,q){return distPos(R,j,p)-distPos(R,j,q)||p-q});
  for(k=0;k+2<(P.r||[]).length;k+=3)R.ret[P.r[k]]=[P.r[k+1],P.r[k+2]];
  if(Array.isArray(P.ta)&&Array.isArray(P.a)&&P.a.length===n){R.ta=P.ta;R.a=P.a}     /* v8: [comuna, sector, alimentador] de cada poste */
  return R;
}
/* Qué se sabe de un número de poste: está en la red ("red"), es un poste retirado con su última posición ("ret"), está repetido ("dup": no se usa) o no está ("none"). */
function redInfo(id){
  if(RED.dup[id])return {k:"dup"};
  var i=RED.idx[id];if(i!==undefined)return {k:"red",i:i};
  var r=RED.ret[id];if(r)return {k:"ret",x:r[0],y:r[1]};
  return {k:"none"};
}
function infoXY(o){return o.k==="red"?[RED.X[o.i],RED.Y[o.i]]:[o.x,o.y]}
function infoDist(p,q){var a=infoXY(p),b=infoXY(q),dx=a[0]-b[0],dy=a[1]-b[1];return Math.round(Math.sqrt(dx*dx+dy*dy))}
function txtDist(m){return m>=1000?(m/1000).toFixed(1).replace(".",",")+" km":m+" m"}
/* Los postes que están en medio: el camino más corto (en postes) entre dos postes de la red, como mucho MAX_SALTOS postes en medio. null si no hay. */
function redRuta(i,j){
  var prev={},seen={},q=[i],nq,u,ns,k,v,d,c,out;seen[i]=1;
  for(d=0;d<=MAX_SALTOS;d++){
    nq=[];
    for(c=0;c<q.length;c++){u=q[c];ns=RED.adj[u]||[];
      for(k=0;k<ns.length;k++){v=ns[k];if(seen[v])continue;seen[v]=1;prev[v]=u;
        if(v===j){out=[v];while(out[0]!==i)out.unshift(prev[out[0]]);return out}
        nq.push(v)}}
    q=nq;if(!q.length)break;
  }
  return null;
}
/* Los vanos que esta brigada ya anotó con el poste "a" (para no sugerir volver atrás). Lo que se está corrigiendo no cuenta. */
function yaHechos(a){
  var ex={};if(!S.profile)return ex;
  S.recs.forEach(function(r){
    if(r._day||r._c!==S.profile.Codigo||tipoDe(r)!==tipoMio()||(S.editing&&r._k===S.sel))return;
    var p=numP(r.Poste_Inicio),q=numP(r.Poste_Fin);
    if(p===a&&q!==null)ex[q]=1;else if(q===a&&p!==null)ex[p]=1;
  });
  return ex;
}
function vanoMsg(tipo,txt){return '<p class="vano '+tipo+'"><b class="ic" aria-hidden="true">'+(tipo==="ok"?"✓":tipo==="warn"?"!":"i")+'</b><span>'+txt+'</span></p>'}
function sugHtml(titulo,btns){return '<div class="sug"><p class="sug-t">'+titulo+'</p><div class="sug-b">'+btns+'</div></div>'}
/* El contenido de la zona de avisos y sugerencias bajo los postes. "" si no hay nada que decir. */
function vanoHtml(){
  if(!RED)return "";
  var a=numP(S.draft.Poste_Inicio),b=numP(S.draft.Poste_Fin);
  if(a===null&&b===null)return "";
  var A=a===null?null:redInfo(a),B=b===null?null:redInfo(b),h="",sug=false,nuevos=[];
  if(A&&A.k==="none")nuevos.push(a);
  if(B&&B.k==="none"&&b!==a)nuevos.push(b);
  if(nuevos.length===1)h+=vanoMsg("info","<b>El "+nuevos[0]+" no está en el mapa.</b> Puede ser un poste nuevo. Se guarda igual.");
  else if(nuevos.length>1)h+=vanoMsg("info","<b>Los postes "+nuevos[0]+" y "+nuevos[1]+" no están en el mapa.</b> Pueden ser postes nuevos. Se guarda igual.");
  if(A&&A.k==="red"){
    if(!B||B.k==="none"||B.k==="dup")sug=true;
    else if(B.k==="red"&&a!==b){
      var directo=null,ns=RED.adj[A.i]||[],k;
      for(k=0;k<ns.length;k++)if(ns[k]===B.i){directo=distPos(RED,A.i,B.i);break}
      if(directo!==null)h+=vanoMsg("ok","<b>Es el poste que sigue</b>, a "+txtDist(directo)+".");
      else{
        sug=true;
        var ruta=redRuta(A.i,B.i);
        if(ruta){
          var en=ruta.slice(1,-1).map(function(p){return "el "+RED.ids[p]}),n=en.length;
          h+=vanoMsg("warn","<b>"+(n===1?"Se salta un poste.":"Se saltan "+n+" postes.")+"</b> Entre el "+a+" y el "+b+(n===1?" está ":" están ")+(n===1?en[0]:en.slice(0,-1).join(", ")+" y "+en[n-1])+". Lo ideal es anotar de poste en poste. Se guarda igual.");
        }else{
          var D=infoDist(A,B);
          h+=D>=LEJOS?vanoMsg("warn","<b>Está lejos.</b> El "+b+" queda a "+txtDist(D)+" del "+a+". Revisa los números. Se guarda igual."):vanoMsg("warn","<b>No hay línea entre el "+a+" y el "+b+" en el mapa.</b> Revisa los números. Se guarda igual.");
        }
      }
    }else if(B.k==="ret"){
      var D2=infoDist(A,B);
      if(D2>=LEJOS){sug=true;h+=vanoMsg("warn","<b>Está lejos.</b> El "+b+" queda a "+txtDist(D2)+" del "+a+". Revisa los números. Se guarda igual.")}
    }
  }
  if(sug){
    var ex=yaHechos(a),vs=[],ns2=RED.adj[A.i]||[],q;
    for(q=0;q<ns2.length&&vs.length<MAX_SUG;q++){var idv=RED.ids[ns2[q]];if(RED.dup[idv]||ex[idv])continue;vs.push('<button type="button" class="sbtn" data-act="sug" data-poste="'+idv+'"><b>'+idv+'</b><small>'+txtDist(distPos(RED,A.i,ns2[q]))+'</small></button>')}
    if(vs.length)h+=sugHtml("Según el mapa, después del "+a+" sigue:",vs.join(""));
  }
  return h;
}
/* Los avisos se actualizan solos 0,7 segundos después de la última tecla (no al salir del recuadro) y nunca mientras hay un dedo (o el mouse) apretando la pantalla:
   si el contenido cambiara justo en ese momento, el botón que se está tocando (Guardar, por ejemplo) se correría y el toque se perdería. */
var tocando=false,vanoPend=false;
document.addEventListener("pointerdown",function(){tocando=true},true);
["pointerup","pointercancel"].forEach(function(n){document.addEventListener(n,function(){
  tocando=false;if(vanoPend){vanoPend=false;clearTimeout(vanoTimer);vanoTimer=setTimeout(vanoUpdate,150)}},true)});
function vanoUpdate(){
  clearTimeout(vanoTimer);
  var z=document.getElementById("vano");if(!z||S.view!=="new")return;
  if(tocando){vanoPend=true;return}
  var h=vanoHtml();if(h!==vanoLast){vanoLast=h;z.innerHTML=h}
  ubicUpdate();
}
function vanoSoon(){clearTimeout(vanoTimer);vanoTimer=setTimeout(vanoUpdate,700)}
/* ---------- v8: comuna, sector y alimentador salen del mapa ---------- */
/* Cada poste del mapa trae su comuna, su sector y su alimentador (los del GeoServer). Si el poste de inicio (o, si ese no está, el de término) está en el mapa,
   la brigada no los anota: la app los muestra y los guarda. Si ninguno de los dos postes está en el mapa, o el teléfono todavía no tiene la red, se piden como antes. */
var ubicLast="";
function redConDatos(){return !!(RED&&RED.ta)}
function datosPoste(id){
  if(id===null||!redConDatos())return null;
  var o=redInfo(id);if(o.k!=="red")return null;
  var j=RED.a[o.i],q=typeof j==="number"&&j>=0?RED.ta[j]:null;
  if(!q||!q[0]||!q[1]||ALIM.indexOf(String(q[2]))<0)return null;
  return {Comuna:String(q[0]),Sector:String(q[1]),Alimentador:String(q[2]),poste:id};
}
function datosDelMapa(d){return datosPoste(numP(d.Poste_Inicio))||datosPoste(numP(d.Poste_Fin))}
/* "auto" = salen del mapa; "espera" = falta el número del poste; "campos" = se anotan a mano. */
function ubicModo(){
  if(!redConDatos())return "campos";
  if(datosDelMapa(S.draft))return "auto";
  return numP(S.draft.Poste_Inicio)===null&&numP(S.draft.Poste_Fin)===null?"espera":"campos";
}
function ubicKey(){var m=ubicModo();if(m!=="auto")return m;var u=datosDelMapa(S.draft);return m+"|"+u.poste+"|"+u.Comuna+"|"+u.Sector+"|"+u.Alimentador}
function ubicHtml(){
  var m=ubicModo();
  if(m==="auto"){var u=datosDelMapa(S.draft);
    return '<div class="ubic-ok"><p class="lbl">Del mapa (poste '+u.poste+')</p><dl><dt>Comuna</dt><dd>'+esc(u.Comuna)+'</dd><dt>Sector</dt><dd>'+esc(u.Sector)+'</dd><dt>Alimentador</dt><dd>'+esc(u.Alimentador)+'</dd></dl></div>'}
  if(m==="espera")return "";
  var h='';
  h+='<div><span class="lbl">Comuna</span>'+chips("Comuna",COMUNAS)+errOf("Comuna")+'</div>';
  h+=field("Sector","Sector",{ph:"Nombre del sector"});
  h+='<div><span class="lbl">Alimentador</span>'+chips("Alimentador",ALIM)+errOf("Alimentador")+'</div>';
  return h;
}
function ubicUpdate(){var z=document.getElementById("ubic");if(!z)return;var k=ubicKey();if(k!==ubicLast){ubicLast=k;z.innerHTML=ubicHtml()}}
/* Un alimentador de antes («1 Norte», «1 Sur» o el número 1) pasa a «1». */
function alimApp(v){v=String(v==null?"":v).trim();if(/^1(\s|$)/.test(v))return "1";return ALIM.indexOf(v)>=0?v:""}
/* Atajo opcional: «Empezar en el X», donde terminó el registro anterior de esta brigada. */
function ultimoFin(){
  if(!S.profile)return null;
  for(var i=S.recs.length-1;i>=0;i--){var r=S.recs[i];
    if(r._day||r._c!==S.profile.Codigo||tipoDe(r)!==tipoMio())continue;
    var f=numP(r.Poste_Fin);if(f!==null)return f}
  return null;
}
function atajoInicio(){
  if(S.editing||String(S.draft.Poste_Inicio||"").trim())return "";
  var f=ultimoFin();if(f===null)return "";
  return '<div class="vz" id="atajo">'+sugHtml("Tu registro anterior terminó en el "+f+":",'<button type="button" class="sbtn" data-act="empezar" data-poste="'+f+'"><b>Empezar en el '+f+'</b></button>')+'</div>';
}
/* La red se baja del servidor y se guarda en el teléfono. */
function redLoad(){
  REDP=idbGet("red").then(function(o){
    if(!o||o.v!==1)return;
    var R=redBuild(o.P);if(!R)return;
    RED=R;REDTS=o.ts||0;
    return idbGet("red-ts").then(function(t){if(t&&t>REDTS)REDTS=t});
  }).then(function(){if(RED&&S.view==="new")vanoUpdate()}).catch(function(){});
}
function redRefresh(){
  if(redBusy||!S.profile||!navigator.onLine||!CFG.API_URL)return;
  redBusy=true;
  (REDP||Promise.resolve()).then(function(){            /* primero se espera a que se lea la copia guardada en el teléfono */
    var t=Date.now();
    if(REDTS&&t-REDTS<RED_CADA&&(redConDatos()||redPedidaSinDatos))return;     /* se revisó hace menos de 6 horas (la red de la versión 7, sin datos de los postes, se pide una vez) */
    if(REDTRY&&t-REDTRY<RED_REINTENTO)return;           /* se intentó hace poco y no resultó: no se insiste */
    REDTRY=t;if(!redConDatos())redPedidaSinDatos=true;
    return api({action:"vecinos",codigo:S.profile.Codigo,h:RED?RED.h:""},60000).then(function(res){
      if(!res||!res.ok)return;
      if(res.igual){if(RED&&res.h===RED.h){REDTS=Date.now();idbPut("red-ts",REDTS).catch(function(){})}return}
      var R=redBuild(res);if(!R)return;
      RED=R;REDTS=Date.now();
      idbPut("red",{v:1,ts:REDTS,P:res}).catch(function(){});
      if(S.view==="new")vanoUpdate();
    });
  }).catch(function(){}).then(function(){redBusy=false});
}
/* Forestal: «poste no terminado». Lo que quedó sin terminar aparece al día siguiente en «Para continuar», con los mismos datos. */
function ddmm(iso){return iso.slice(8,10)+"-"+iso.slice(5,7)}
function paraContinuar(){
  if(isLev()||!S.profile)return [];
  var t=today(),cut=daysAgo(7);
  return S.recs.filter(function(r){return r._nt&&!r._day&&r._c===S.profile.Codigo&&tipoDe(r)==="f"&&r.Fecha<t&&r.Fecha>=cut})
    .sort(function(x,y){return x.Fecha<y.Fecha?1:x.Fecha>y.Fecha?-1:0});
}
function contSection(){
  var l=paraContinuar();if(!l.length)return "";
  return '<section style="display:flex;flex-direction:column;gap:8px"><h2>Para continuar</h2><p class="note">Quedaron sin terminar. Toca para seguir con los mismos datos.</p>'+l.map(function(r){
    return '<button class="item" data-act="cont" data-id="'+esc(r._k)+'"><span><b>Postes '+esc(r.Poste_Inicio)+' a '+esc(r.Poste_Fin)+'</b><small>'+esc(r.Comuna)+' · '+esc(r.Sector)+' · Alimentador '+esc(r.Alimentador)+'</small><small>Propietario: '+esc(r.Propietario)+' · '+(r.Fecha===daysAgo(1)?'desde ayer ('+ddmm(r.Fecha)+')':'desde el '+ddmm(r.Fecha))+'</small></span><span class="tag go">Continuar ›</span></button>'}).join("")+'</section>';
}
function ntControl(){
  if(!S.draft.Terminado)S.draft.Terminado=NT_SI;
  return '<div class="nt"><span class="lbl">¿Terminaste estos postes?</span>'+chips("Terminado",[NT_SI,NT_NO])+'</div>';
}
/* El aviso de arriba de «Agregar postes»: qué se copió del registro anterior (o de los postes que se siguen). */
function okNuevo(){
  if(S.editing)return "";
  if(S.cont){
    var c=S.recs.filter(function(x){return x._k===S.contFrom})[0];
    return '<p class="okmsg">Son los mismos postes '+(c&&c.Fecha!==daysAgo(1)?'del '+ddmm(c.Fecha):'de ayer')+'. Copiamos todos los datos: <b>escribe solo lo que hiciste hoy.</b></p>';
  }
  if(!S.copied||redConDatos())return "";      /* con el mapa, la comuna, el sector y el alimentador salen del poste */
  return '<p class="okmsg">Copiamos la comuna, el sector y el alimentador del registro anterior. <b>Cambia solo lo que sea distinto.</b></p>';
}

/* ---------- Pantallas ---------- */
function chips(field,opts){

    return '<button type="button" class="chip" data-chip="'+field+'" data-val="'+esc(o)+'" aria-pressed="'+(S.draft[field]===o)+'">'+esc(o)+'</button>'}).join("")+'</div>';

function errOf(id){return S.err[id]?'<p class="err">'+esc(S.err[id])+'</p>':""}
function toMin(t){var a=t.split(":");return parseInt(a[0],10)*60+parseInt(a[1],10)}

function pill(){
  if(S.guardaMal)return '<span class="pill warn"><span class="dot"></span>No se pudo guardar en el teléfono</span>';
  var u=unsynced();
  if(!navigator.onLine)return '<span class="pill warn"><span class="dot"></span>Sin señal'+(u?' · '+u+' por enviar':'')+'</span>';
  if(S.syncErr||S.docErr||S.fotoErr)return '<span class="pill warn"><span class="dot"></span>No se pudo enviar · '+u+' por enviar</span>';
  if(u)return '<span class="pill warn"><span class="dot"></span>Enviando…</span>';
  var nm=fotosMalas().length;
  if(nm)return '<span class="pill warn"><span class="dot"></span>'+nm+(nm===1?' foto no aceptada':' fotos no aceptadas')+'</span>';
  return '<span class="pill ok"><span class="dot"></span>'+lastOkTxt()+'</span>';
}

/* ---------- Guardado ---------- */
function normHora(v){var g=String(v||"").replace(/\D/g,"");return g.length===3?"0"+g[0]+":"+g.slice(1):g.length===4?g.slice(0,2)+":"+g.slice(2):v}
function saveDay(){
  var d=S.draft,e={};d.hi=normHora(d.hi);d.ht=normHora(d.ht);
  d.ID=(d.ID||"").trim();
  if(!PTRE.test(d.PT||""))e.PT="El N° de PT es una R y 6 números. Ejemplo: R011026.";
  if(!d.ID)e.ID="Escribe el ID.";
  if(cobraKm()&&d.km&&isNaN(parseFloat(d.km)))e.km="Escribe los kilómetros con números.";
  var HRE=/^([01]\d|2[0-3]):[0-5]\d$/;
  if(d.hi&&!HRE.test(d.hi))e.hi="Escribe la hora con números. Ejemplo: 845 o 0845.";
  if(d.ht&&!HRE.test(d.ht))e.ht="Escribe la hora con números. Ejemplo: 1435.";
  if(!e.hi&&!e.ht&&d.hi&&d.ht&&toMin(d.ht)<toMin(d.hi))e.ht="La hora de término es antes que la de inicio.";
  S.err=e;if(Object.keys(e).length){render();return}
  S.day={fecha:today(),PT:d.PT,ID:d.ID,hi:d.hi||"",ht:d.ht||"",km:cobraKm()?(d.km||""):""};
  applyDay();ensureDayRow();save();
  var next=S.afterDay;S.afterDay=false;
  if(next){newDraft();go("new")}else{toast("Datos del día guardados");go("home")}
}
function newDraft(){
  var d={};
  claves(isLev()).forEach(function(k){d[k]=""});
  S.cont=false;S.copied=false;
  /* «Para continuar» (forestal): los mismos postes de un día anterior, con todos sus datos menos la producción (esa empieza vacía). */
  var c=S.contFrom&&!isLev()?S.recs.filter(function(x){return x._k===S.contFrom})[0]:null;
  if(c){
    ["Comuna","Sector","Alimentador","Poste_Inicio","Poste_Fin","Propietario"].forEach(function(k){d[k]=String(c[k]==null?"":c[k])});
    d.Alimentador=alimApp(d.Alimentador);
    S.cont=true;S.draft=d;return;
  }
  /* Del registro anterior de hoy se copian SOLO comuna, sector y alimentador (los postes no son siempre correlativos). Solo se ven si los postes no están en el mapa. */
  var rs=real(),p=rs.length?rs[rs.length-1]:null;
  S.copied=!!(p&&p.Comuna&&p.Sector&&p.Alimentador);
  if(S.copied){d.Comuna=p.Comuna;d.Sector=p.Sector;d.Alimentador=alimApp(p.Alimentador)}
  S.draft=d;
}
var EDIT=["Alimentador","Comuna","Sector","Poste_Inicio","Poste_Fin","Propietario"];
/* Los datos de un registro que se escriben en los formularios (cambian según el tipo de brigada). */
function claves(lev){return lev?EDIT.concat(["Fono"],LEVN,["Especie"]):EDIT.concat(PROD.map(function(q){return q[0]}))}
/* Del formulario al registro, y del registro al formulario (todo=true incluye también los postes, la comuna, el sector y el propietario). */
function aplica(d,r){
  claves(tipoDe(r)==="l").forEach(function(k){r[k]=String(d[k]==null?"":d[k]).trim()});
}
function alForm(r,d,todo){
  var lev=tipoDe(r)==="l",ks=lev?LEVN.concat(["Especie"]):PROD.map(function(q){return q[0]});
  if(todo)ks=EDIT.concat(lev?["Fono"]:[],ks);
  ks.forEach(function(k){d[k]=r[k]==null?"":String(r[k])});
  if(todo)d.Alimentador=alimApp(d.Alimentador);
  if(!lev)d.Terminado=r._nt?NT_NO:NT_SI;
}
function saveNew(){
  var d=S.draft,e={},lev=isLev(),u=datosDelMapa(d);
  if(u){d.Comuna=u.Comuna;d.Sector=u.Sector;d.Alimentador=u.Alimentador}      /* v8: salen del mapa */
  else{
    if(COMUNAS.indexOf(d.Comuna)<0)e.Comuna="Elige una opción.";
    if(ALIM.indexOf(d.Alimentador)<0)e.Alimentador="Elige una opción.";
    if(!String(d.Sector||"").trim())e.Sector="Este dato es obligatorio.";
  }
  if(!lev&&!String(d.Propietario||"").trim())e.Propietario="Este dato es obligatorio.";
  ["Poste_Inicio","Poste_Fin"].forEach(function(k){if(!d[k])e[k]="Escribe un número."});
  S.err=e;
  if(Object.keys(e).length){render();var f=document.querySelector(".err");if(f)f.scrollIntoView({block:"center"});return}
  if(S.editing){
    var r0=S.recs.filter(function(x){return x._k===S.sel})[0];
    aplica(d,r0);
    touch(r0);save();toast("Cambios guardados");go("home");return
  }
  var dr=mine().filter(function(x){return x._day})[0];
  var r=dr||blank();
  aplica(d,r);
  r.Fecha=today();r.PT=dayInfo().PT;r.ID=dayInfo().ID;
  if(dr){delete r._day}else{r._k="k"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);r._c=S.profile.Codigo;S.recs.push(r)}
  if(S.contFrom){var oc=S.recs.filter(function(x){return x._k===S.contFrom})[0];if(oc)delete oc._nt;S.contFrom=null;S.cont=false}
  touch(r);applyDay();save();
  S.draft={};alForm(r,S.draft);
  toast(lev?(navigator.onLine?"Postes guardados. Ahora toma las fotos":"Guardado en el teléfono. Ahora toma las fotos"):(navigator.onLine?"Postes guardados. Ahora toma las fotos de antes":"Guardado en el teléfono. Ahora toma las fotos de antes"));
  go("finish",r._k);
}
function saveFinish(){
  var d=S.draft,r=S.recs.filter(function(x){return x._k===S.sel})[0];
  if(!r){go("home");return}
  if(tipoDe(r)==="l"){
    var esp=String(d.Especie||"").trim();
    if(!esp&&!LEVN.some(function(k){return d[k]!==""&&d[k]!=null})){
      S.err={prod:"Escribe la especie (si no hay árboles, escribe «Pradera») o anota al menos un dato."};render();
      var fe=document.querySelector(".err");if(fe)fe.scrollIntoView({block:"center"});return
    }
    LEVN.forEach(function(k){r[k]=d[k]||""});r.Especie=esp;
    touch(r);save();toast(navigator.onLine?"Levantamiento guardado":"Guardado en el teléfono");go("home");return
  }
  if(!PROD.some(function(q){return d[q[0]]!==""&&d[q[0]]!=null})){S.err={prod:"Escribe al menos un dato. Si no hiciste nada, escribe 0."};render();return}
  PROD.forEach(function(p){r[p[0]]=d[p[0]]||""});
  if(d.Terminado===NT_NO)r._nt=true;else delete r._nt;
  touch(r);save();toast(r._nt?(navigator.onLine?"Guardado. Queda para continuar mañana":"Guardado en el teléfono. Queda para continuar mañana"):(navigator.onLine?"Producción guardada":"Guardado en el teléfono"));go("home");
}
function doLogin(){
  var c=String(S.draft.Codigo||"").trim().toUpperCase();
  if(!c){S.err={Codigo:"Escribe el código."};render();return}
  if(S.busy)return;S.busy=true;S.err={};render();
  api({action:"login",codigo:c}).then(function(res){
    S.busy=false;
    if(res&&res.ok){
      if(S.profile&&S.profile.Codigo!==c)S.day=null;
      S.profile={Codigo:c,Empresa:res.empresa,Brigada:res.brigada,Km:!!res.km,Tipo:res.tipo==="levantamiento"?"levantamiento":"forestal"};
      persist();toast("Listo. La app ya sabe quién eres");go("home");sync();
    }else{S.err={Codigo:"Ese código no existe. Revísalo o pídelo a tu empresa."};render()}
  }).catch(function(e){
    S.busy=false;
    S.err={Codigo:e&&e.code==="config"?"La app no está configurada todavía. Avisa al administrador.":"No se pudo conectar. Revisa tu señal e intenta de nuevo."};render();
  });
}

/* ---------- Eventos ---------- */
document.addEventListener("click",function(ev){
  var chip=ev.target.closest("[data-chip]");
  if(chip){var f=chip.getAttribute("data-chip");S.draft[f]=chip.getAttribute("data-val");delete S.err[f];
    chip.parentNode.querySelectorAll(".chip").forEach(function(c){c.setAttribute("aria-pressed",String(c===chip))});
    if(f==="Terminado"){var nn=document.getElementById("nt-note");if(nn)nn.hidden=chip.getAttribute("data-val")!==NT_NO}
    return}
  var b=ev.target.closest("[data-act]");if(!b)return;
  var a=b.getAttribute("data-act");
  if(a==="home")go("home");
  else if(a==="edit"){var re=S.recs.filter(function(x){return x._k===S.sel})[0];if(re){S.draft={};alForm(re,S.draft,true);S.editing=true;go("new",re._k)}}
  else if(a==="prop-igual"){var pa=propAnterior();if(pa){S.draft.Propietario=pa.Propietario;S.draft.Fono=pa.Fono||"";delete S.err.Propietario;render()}}
  else if(a==="del"){S.confirmDel=true;render()}
  else if(a==="del-no"){S.confirmDel=false;render()}
  else if(a==="del-yes"){var rd=S.recs.filter(function(x){return x._k===S.sel})[0];
    if(rd){S.recs=S.recs.filter(function(x){return x!==rd});S.dels.push({k:rd._k,c:rd._c,t:tipoDe(rd)});applyDay();ensureDayRow();save();toast("Postes borrados")}go("home")}
  else if(a==="sug"){var pf=b.getAttribute("data-poste"),ipf=document.getElementById("f-Poste_Fin");S.draft.Poste_Fin=pf;delete S.err.Poste_Fin;
    if(ipf){ipf.value=pf;var epf=ipf.parentNode.querySelector(".err");if(epf)epf.remove()}vanoUpdate()}
  else if(a==="empezar"){var pi=b.getAttribute("data-poste"),ipi=document.getElementById("f-Poste_Inicio"),fin=document.getElementById("f-Poste_Fin");S.draft.Poste_Inicio=pi;delete S.err.Poste_Inicio;
    if(ipi){ipi.value=pi;var epi=ipi.parentNode.querySelector(".err");if(epi)epi.remove()}
    var at=document.getElementById("atajo");if(at)at.style.display="none";vanoUpdate();if(fin)fin.focus()}
  else if(a==="cont"){var rc=S.recs.filter(function(x){return x._k===b.getAttribute("data-id")})[0];
    if(rc){S.editing=false;S.contFrom=rc._k;if(!dayInfo()){S.afterDay=true;S.draft={PT:"",ID:"",hi:"",ht:"",km:""};go("day")}else{newDraft();go("new")}}}
  else if(a==="new"){S.editing=false;S.contFrom=null;S.cont=false;if(!dayInfo()){S.afterDay=true;S.draft={PT:"",ID:"",hi:"",ht:"",km:""};go("day")}else{newDraft();go("new")}}
  else if(a==="day"){var di=dayInfo();S.afterDay=false;S.draft={PT:di?di.PT:"",ID:di?di.ID:"",hi:di?di.hi:"",ht:di?di.ht:"",km:di?di.km:""};go("day")}
  else if(a==="foto")openCam(b.getAttribute("data-fase"));
  else if(a==="ver")verFoto(b.getAttribute("data-id"));
  else if(a==="cam-x")camClose();
  else if(a==="cam-shoot")camShoot();
  else if(a==="cam-use")camUse();
  else if(a==="cam-redo"){if(CAM){CAM.shot=null;CAM.st="live";CAM.sig="";if(!camLive())camStream();camUi()}}
  else if(a==="cam-retry"){var tf=CAM&&CAM.fase;camClose();if(tf)openCam(tf)}
  else if(a==="cam-clock")relojMedir();
  else if(a==="vis-x")visClose();
  else if(a==="quitar")quitarPreguntar(b.getAttribute("data-id"));
  else if(a==="quitar-si")quitarFoto(b.getAttribute("data-id"));
  else if(a==="save-day")saveDay();
  else if(a==="save-new")saveNew();
  else if(a==="open"){var id=b.getAttribute("data-id"),r=S.recs.filter(function(x){return x._k===id})[0];
    if(r){S.draft={};alForm(r,S.draft);go("finish",id)}}
  else if(a==="save-finish")saveFinish();
  else if(a==="save-profile")doLogin();
  else if(a==="change-profile"){S.draft={Codigo:""};go("setup")}
});
document.addEventListener("focusout",function(ev){
  var t=ev.target;if(!t||(t.id!=="f-hi"&&t.id!=="f-ht"))return;
  var nv=normHora(t.value);if(nv!==t.value){t.value=nv;S.draft[t.id==="f-hi"?"hi":"ht"]=nv}
});
document.addEventListener("input",function(ev){
  var t=ev.target;
  if(t.id==="f-hi"||t.id==="f-ht"){var dg=t.value.replace(/\D/g,"").slice(0,4),hv=dg.length===4?dg.slice(0,2)+":"+dg.slice(2):dg.length===3?dg[0]+":"+dg.slice(1):dg;if(hv!==t.value)t.value=hv;var hk=t.id==="f-hi"?"hi":"ht";S.draft[hk]=hv;delete S.err[hk];var hn=t.parentNode.querySelector(".err");if(hn)hn.remove();return}
  if(t.id==="f-km"){var kv=t.value.replace(",",".").replace(/[^0-9.]/g,"").replace(/(\..*)\./g,"$1");if(kv!==t.value)t.value=kv;S.draft.km=kv;delete S.err.km;return}
  var f=t.getAttribute&&t.getAttribute("data-f");if(!f)return;
  var v=t.value;
  if(f==="PT")v=v.toUpperCase().replace(/[^R0-9]/g,"").slice(0,7);
  else if(f==="Codigo")v=v.toUpperCase().replace(/\s/g,"");
  else if(f==="Fono")v=v.replace(/\D/g,"").slice(0,15);
  else if(["Poste_Inicio","Poste_Fin"].indexOf(f)>-1||t.getAttribute("data-kind")==="n")v=v.replace(/\D/g,"");
  else if(t.getAttribute("data-kind")==="d")v=v.replace(",",".").replace(/[^0-9.]/g,"").replace(/(\..*)\./g,"$1");
  if(v!==t.value)t.value=v;
  S.draft[f]=v;delete S.err[f];
  var nx=t.parentNode.querySelector(".err");if(nx)nx.remove();
  if(f==="Poste_Inicio"||f==="Poste_Fin"){if(f==="Poste_Inicio"){var at2=document.getElementById("atajo");if(at2)at2.style.display=v?"none":""}vanoSoon()}
  if(LEVN.indexOf(f)>-1||(f==="Especie"&&v.trim()))avisoProdFuera();
});
document.addEventListener("keydown",function(ev){
  if(ev.key==="Enter"&&ev.target.id==="f-Codigo"){ev.preventDefault();doLogin()}
  if(ev.key==="Escape"){if(CAM)camClose();else visClose()}
});
window.addEventListener("resize",function(){if(CAM)camFit()});
window.addEventListener("online",function(){if(S.view==="home")render();sync()});
window.addEventListener("offline",function(){if(S.view==="home")render()});
document.addEventListener("visibilitychange",function(){
  if(CAM){if(document.hidden)camStop();else{if(CAM.st!=="review"&&CAM.st!=="err"){CAM.st="start";camStream();camUi()}relojMedir()}}
  if(!document.hidden){if(S.view==="home")render();sync()}
});
setInterval(function(){if(unsynced())sync()},30000);

/* Lo que se escribe se guarda como borrador en cada cambio (después de que los manejadores de arriba actualizan S.draft). */
document.addEventListener("input",function(){guardaBorrador()});
document.addEventListener("click",function(ev){if(ev.target.closest&&ev.target.closest("[data-chip],[data-act=sug],[data-act=empezar],[data-act=prop-igual]"))guardaBorrador()});
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){})}catch(e){}     /* que el teléfono no borre los datos de la app por falta de espacio */
load();redLoad();
if(!S.profile){S.view="setup";S.draft={Codigo:""}}
else if(recuperaBorrador()){}
render();sync();
setTimeout(limpiarFotos,3000);
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}

</script>
